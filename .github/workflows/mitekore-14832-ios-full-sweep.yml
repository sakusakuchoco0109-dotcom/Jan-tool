name: MiteKore 14832 iOS Full Sweep
on:
  push:
    paths:
      - 'mitekore-14832-ios-full-sweep.js'
      - '.github/workflows/mitekore-14832-ios-full-sweep.yml'
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install webkit --with-deps
          node --check mitekore-14832-ios-full-sweep.js
      - name: Run iPhone Safari full sweep
        run: node mitekore-14832-ios-full-sweep.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-14832-ios-full-sweep
          path: |
            mitekore-14832-ios-full-sweep-result.json
            14832-sweep-*.png