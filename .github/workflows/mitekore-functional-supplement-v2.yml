name: MiteKore Functional Supplement V2
on:
  push:
    paths:
      - '.github/workflows/mitekore-functional-supplement-v2.yml'
      - 'mitekore-functional-supplement-v2.js'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare browser
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Run supplemental production audit
        run: node mitekore-functional-supplement-v2.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-functional-supplement-v2
          path: |
            functional-supplement-v2-result.json
            supp-v2-*.png
