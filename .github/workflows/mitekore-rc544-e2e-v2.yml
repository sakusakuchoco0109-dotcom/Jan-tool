name: MiteKore RC544 Candidate E2E V2
on:
  push:
    paths:
      - '.github/workflows/mitekore-rc544-e2e-v2.yml'
      - 'mitekore-rc544-e2e-v2.js'
      - 'mitekore-rc544-index.patch'
      - 'mitekore-rc544-core.patch'
      - 'mitekore-rc544-label.patch'
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Build RC544 candidate from current production
        run: |
          set -euxo pipefail
          APP='https://hilarious-haupia-6e0406.netlify.app/'
          mkdir -p candidate/assets
          curl -fsSL "$APP" -o candidate/index.html
          curl -fsSL "${APP}mitekore-version.js" -o candidate/mitekore-version.js || true
          python3 - <<'PY'
          import re,urllib.request,pathlib
          app='https://hilarious-haupia-6e0406.netlify.app/'; root=pathlib.Path('candidate'); html=(root/'index.html').read_text()
          paths=set(re.findall(r'(?:src|href)=["\'](assets/[^"\'?]+)',html)); paths.update({'assets/base.css','assets/release-theme.css','assets/font-large.css','assets/font-xlarge.css','assets/mitekore-logo.webp','assets/sticker-image_data.webp','assets/sticker-qr_data.png'})
          for rel in sorted(paths):
              dst=root/rel; dst.parent.mkdir(parents=True,exist_ok=True)
              try:
                  with urllib.request.urlopen(app+rel,timeout=30) as r: dst.write_bytes(r.read())
              except Exception:
                  if 'app-core-' in rel: raise
          core=next(p for p in paths if re.fullmatch(r'assets/app-core-\d+\.js',p)); (root/'assets/app-core-544.js').write_bytes((root/core).read_bytes())
          html=re.sub(r'<title>みてコレ！ V20\.2\.35ex RC1\.4\.\d+ 配布版</title>','<title>みてコレ！ V20.2.35ex RC1.4.542 配布版</title>',html,count=1); html=re.sub(r'assets/app-core-\d+\.js','assets/app-core-542.js',html); (root/'index.html').write_text(html)
          PY
          patch --fuzz=3 candidate/index.html < mitekore-rc544-index.patch
          patch --fuzz=3 candidate/index.html < mitekore-rc544-label.patch
          patch --fuzz=3 candidate/assets/app-core-544.js < mitekore-rc544-core.patch
          python3 - <<'PY'
          import re,pathlib
          c=pathlib.Path('candidate/assets/app-core-544.js'); s=c.read_text(); s=re.sub(r"const APP_VERSION_LABEL = 'V20\.2\.35ex RC1\.4\.\d+';","const APP_VERSION_LABEL = 'V20.2.35ex RC1.4.544';",s,count=1); c.write_text(s)
          v=pathlib.Path('candidate/mitekore-version.js'); t=v.read_text() if v.exists() and v.stat().st_size else "window.__MITEKORE_PUBLIC_BUILD__={app:'mitekore',version:'20.2.35ex',pairProtocol:6,build:'RC1.4.544',rc:'1.4.544'};"; t=re.sub(r"build:\s*'RC1\.4\.\d+'","build: 'RC1.4.544'",t); t=re.sub(r"rc:\s*'1\.4\.\d+'","rc: '1.4.544'",t); v.write_text(t)
          for p in pathlib.Path('candidate/assets').glob('app-core-*.js'):
              if p.name!='app-core-544.js': p.unlink()
          pathlib.Path('candidate/_headers').write_text('/index.html\n  Cache-Control: no-cache, max-age=0, must-revalidate\n/mitekore-version.js\n  Cache-Control: no-store, max-age=0\n/assets/base.css\n  Cache-Control: no-cache, max-age=0, must-revalidate\n/assets/release-theme.css\n  Cache-Control: no-cache, max-age=0, must-revalidate\n/assets/font-large.css\n  Cache-Control: no-cache, max-age=0, must-revalidate\n/assets/font-xlarge.css\n  Cache-Control: no-cache, max-age=0, must-revalidate\n/assets/app-core-544.js\n  Cache-Control: public, max-age=31536000, immutable\n/assets/mitekore-logo.webp\n  Cache-Control: public, max-age=31536000, immutable\n/assets/sticker-image_data.webp\n  Cache-Control: public, max-age=31536000, immutable\n/assets/sticker-qr_data.png\n  Cache-Control: public, max-age=31536000, immutable\n')
          PY
          node --check candidate/assets/app-core-544.js
          grep -q '>RC1.4.544<' candidate/index.html
          grep -q 'RC1.4.544 先行体験版' candidate/index.html
          grep -q 'assets/app-core-544.js' candidate/index.html
          sha256sum candidate/index.html candidate/assets/app-core-544.js candidate/mitekore-version.js | tee rc544v2-sha256.txt
      - name: Prepare browser
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Serve candidate
        run: |
          python3 -m http.server 8899 --directory candidate > rc544v2-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8899/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run regressions
        run: node mitekore-rc544-e2e-v2.js
      - name: Package exact tested candidate
        if: always()
        run: cd candidate && zip -qr ../mitekore-RC1.4.544-tested-v2.zip .
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-rc544-tested-v2
          path: |
            rc544v2-result.json
            rc544v2-*.png
            rc544v2-sha256.txt
            rc544v2-http.log
            mitekore-RC1.4.544-tested-v2.zip
            candidate/index.html
            candidate/mitekore-version.js
            candidate/_headers
            candidate/assets/app-core-544.js
