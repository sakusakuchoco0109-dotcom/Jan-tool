name: GAS Comment Isolation 0912
on:
  push:
    paths:
      - '.github/workflows/gas-comment-isolation-0912.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Isolate status and comment latency
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec
        run: |
          python - <<'PY'
          import json, os, time, statistics, urllib.parse, urllib.request
          ep=os.environ['ENDPOINT']; ua='Mozilla/5.0 GitHubActions FujiyaIsolation/0912'
          tests=[
            ('status', {'action':'status'}),
            ('comments_existing', {'action':'mitekore_comments','parentId':'mh_fe3cffd5-5bd6-4c5b-9623-f70499af22e7','limit':'80'}),
            ('comments_empty', {'action':'mitekore_comments','parentId':'mh_1fad85a1-fd2b-43b4-a366-055277d05ec5','limit':'80'}),
            ('magazine_read', {'action':'magazine_read','articleId':'mag_ai_aiq_20260908_0020_014'}),
          ]
          out=[]
          for name,params in tests:
            vals=[]; fails=[]
            for i in range(3):
              q=dict(params); q['_']=str(int(time.time()*1000))
              url=ep+'?'+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json,text/plain,*/*'})
              t=time.perf_counter()
              try:
                with urllib.request.urlopen(req,timeout=50) as r:
                  raw=r.read(); code=getattr(r,'status',200)
                sec=time.perf_counter()-t
                data=json.loads(raw.decode('utf-8','replace'))
                ok=(200<=code<400 and data.get('ok') is not False and data.get('version')=='3.13.23')
                if ok: vals.append(sec)
                else: fails.append({'i':i+1,'code':code,'data':data})
                print(f'{name} #{i+1}: {sec:.3f}s code={code} ok={ok} version={data.get("version")} size={len(raw)}')
              except Exception as e:
                sec=time.perf_counter()-t
                fails.append({'i':i+1,'error':repr(e),'elapsed':sec})
                print(f'{name} #{i+1}: ERROR after {sec:.3f}s {e!r}')
              time.sleep(1.2)
            out.append({'name':name,'success':len(vals),'fail':len(fails),'min':min(vals) if vals else None,'median':statistics.median(vals) if vals else None,'max':max(vals) if vals else None,'failures':fails})
          print('ISOLATION_JSON='+json.dumps(out,ensure_ascii=False))
          PY
