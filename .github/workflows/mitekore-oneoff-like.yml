name: MiteKore Oneoff Like
on:
  push:
    paths:
      - '.github/workflows/mitekore-oneoff-like.yml'
  workflow_dispatch:

jobs:
  like:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Like latest owner MiteKore post
        env:
          APP_URL: https://hilarious-haupia-6e0406.netlify.app/
          GAS_URL: https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const APP=process.env.APP_URL, GAS=process.env.GAS_URL;
          const TEST_USER=`fujiya_chatgpt_like_${process.env.GITHUB_RUN_ID}_${process.env.GITHUB_RUN_ATTEMPT}`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function gasGet(params={}){const u=new URL(GAS);for(const[k,v]of Object.entries(params))u.searchParams.set(k,String(v));const r=await fetch(u,{redirect:'follow'});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch{};return j}
          async function dismiss(page){for(const sel of ['[data-profile-unlock-close]','#rareBurstCloseBtn','.mike-talk-close','#tutorialCloseBtn','#firstRunCloseBtn','#devicePairCloseBtn']){try{const x=page.locator(sel).first();if(await x.count()&&await x.isVisible())await x.click({force:true,timeout:700})}catch{}}}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1200}});
            await ctx.addInitScript(({TEST_USER,GAS})=>{
              localStorage.setItem('fujiya_collection_user_id',TEST_USER);
              localStorage.setItem('fujiya_mitereco_identity_user_v2',TEST_USER);
              localStorage.setItem('fujiya_collection_user_name','チャッピー');
              localStorage.setItem('fujiya_collection_profile_v20_1',JSON.stringify({name:'チャッピー',bio:'いいね動作確認用',favoritePlatforms:[],favoriteGames:[],links:{},visibility:{}}));
              localStorage.setItem('fujiya_collection_setup_done_v1','1');
              localStorage.setItem('fujiya_collection_tutorial_seen_v2_rc1474','1');
              localStorage.setItem('fujiya_collection_first_run_seen_v20_2_35cn','1');
              localStorage.setItem('fujiya_collection_share_opt_in_v1','1');
              localStorage.setItem('fujiya_collection_gas_endpoint',GAS);
            },{TEST_USER,GAS});
            const page=await ctx.newPage();
            await page.goto(APP,{waitUntil:'domcontentloaded',timeout:60000});
            await sleep(7000);await dismiss(page);
            const mag=page.locator('[data-ui-tab="magazine"]:visible').first();await mag.click({force:true});await sleep(1500);await dismiss(page);
            const mk=page.locator('[data-mag-view="mitekore"]:visible').first();if(await mk.count()){await mk.click({force:true});await sleep(1200)}
            await page.waitForFunction(()=>document.querySelectorAll('#miteHoshiiFeed .mh-card[data-mh-post]').length>0,{timeout:70000});
            const cards=page.locator('#miteHoshiiFeed .mh-card[data-mh-post]');
            let chosen=null;
            for(let i=0;i<Math.min(await cards.count(),80);i++){
              const c=cards.nth(i);const text=(await c.innerText().catch(()=>''))||'';
              if(!text.includes('藤や玩具店 店長')) continue;
              const like=c.locator('[data-mh-pt]').first();if(!await like.count()) continue;
              chosen={i,text:text.replace(/\s+/g,' ').slice(0,220),post:await c.getAttribute('data-mh-post')};break;
            }
            if(!chosen)throw new Error('店長の見てコレ投稿が見つからない');
            const card=cards.nth(chosen.i),like=card.locator('[data-mh-pt]').first();
            await like.click({force:true});await sleep(7000);
            const st=await gasGet({action:'pt_like_state',userId:TEST_USER,postKeys:chosen.post});
            const row=st?.likes?.[0];
            console.log('ONEOFF_LIKE',JSON.stringify({testUser:TEST_USER,chosen,row}));
            if(!row?.liked)throw new Error('いいね保存失敗');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE