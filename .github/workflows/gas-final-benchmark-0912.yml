name: GAS Final Benchmark 0912
on:
  push:
    paths:
      - '.github/workflows/gas-final-benchmark-0912.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Benchmark deployed GAS reads
        shell: bash
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec
        run: |
          python - <<'PY'
          import json, os, statistics, time, urllib.parse, urllib.request, sys

          ENDPOINT=os.environ['ENDPOINT']
          EXPECT='3.13.23'
          N=3
          UA='Mozilla/5.0 GitHubActions FujiyaGASBenchmark/2026-09-12'

          def fetch(params, timeout=50):
              q=dict(params)
              q['_']=str(int(time.time()*1000))
              url=ENDPOINT+'?'+urllib.parse.urlencode(q, doseq=True)
              req=urllib.request.Request(url, headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*'})
              t=time.perf_counter()
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw=r.read()
                  code=getattr(r,'status',200)
              sec=time.perf_counter()-t
              try:
                  data=json.loads(raw.decode('utf-8','replace'))
              except Exception:
                  data={'ok':False,'parse_error':True,'raw_prefix':raw[:300].decode('utf-8','replace')}
              return sec, code, data, len(raw)

          def bench(name, params, validate=None):
              times=[]; fails=[]; last=None; sizes=[]
              for i in range(N):
                  try:
                      sec,code,data,size=fetch(params)
                      last=data; sizes.append(size)
                      ok=(200 <= code < 400) and (data.get('ok') is not False)
                      if validate:
                          ok=ok and bool(validate(data))
                      if ok: times.append(sec)
                      else: fails.append({'i':i+1,'code':code,'data':data})
                      print(f'SAMPLE {name} #{i+1}: {sec:.3f}s code={code} ok={ok} size={size} version={data.get("version")}')
                  except Exception as e:
                      fails.append({'i':i+1,'error':repr(e)})
                      print(f'SAMPLE {name} #{i+1}: ERROR {e!r}')
              if times:
                  res={'name':name,'n':N,'success':len(times),'fail':len(fails),'min':min(times),'median':statistics.median(times),'max':max(times),'avg':statistics.mean(times),'size_last':sizes[-1] if sizes else None,'version':(last or {}).get('version'),'failures':fails}
              else:
                  res={'name':name,'n':N,'success':0,'fail':len(fails),'min':None,'median':None,'max':None,'avg':None,'size_last':sizes[-1] if sizes else None,'version':(last or {}).get('version'),'failures':fails}
              RESULTS.append(res)
              return last or {}

          RESULTS=[]

          status=bench('status', {'action':'status'}, lambda d:d.get('version')==EXPECT)
          if status.get('version')!=EXPECT:
              print('FATAL: deployed version is not',EXPECT,'actual=',status.get('version'))

          feed=bench('mitekore_feed_80', {'action':'mitekore_feed','limit':'80'}, lambda d:isinstance(d.get('posts'),list))
          posts=feed.get('posts') or []
          parent_id=''
          post_keys=[]
          for p in posts:
              if not isinstance(p,dict): continue
              pid=str(p.get('id') or p.get('postId') or '').strip()
              if pid and not parent_id: parent_id=pid
              if pid: post_keys.append(pid)
              if len(post_keys)>=5: break

          if parent_id:
              bench('mitekore_comments', {'action':'mitekore_comments','parentId':parent_id,'limit':'80'}, lambda d:isinstance(d.get('comments'),list))
          else:
              RESULTS.append({'name':'mitekore_comments','n':0,'success':0,'fail':1,'note':'no parent id from feed'})

          mag=bench('magazine_list_light_30', {'action':'magazine_list_light','limit':'30','offset':'0'}, lambda d:isinstance(d.get('articles'),list))
          articles=mag.get('articles') or []
          article_id=''
          if articles and isinstance(articles[0],dict):
              article_id=str(articles[0].get('articleId') or articles[0].get('id') or '').strip()
          if article_id:
              bench('magazine_read', {'action':'magazine_read','articleId':article_id}, lambda d:isinstance(d.get('article'),dict))
              bench('magazine_comments', {'action':'magazine_comments','articleId':article_id,'limit':'80'}, lambda d:isinstance(d.get('comments'),list))
              post_keys.append('article:'+article_id)
          else:
              RESULTS.append({'name':'magazine_read','n':0,'success':0,'fail':1,'note':'no article id'})
              RESULTS.append({'name':'magazine_comments','n':0,'success':0,'fail':1,'note':'no article id'})

          keys=','.join(post_keys[:8])
          if keys:
              bench('pt_like_state', {'action':'pt_like_state','userId':'github_readonly_bench_0912','postKeys':keys}, lambda d:isinstance(d.get('likes'),list))

          bench('stats_titles_read_4', {'action':'stats_titles_read','titleIds':'FC-G004369,FC-G004049,SFC-G002085,SFC-G000006'}, lambda d:isinstance(d.get('stats'),list))
          bench('mitekore_related_sweethome', {'action':'mitekore_related','sharedTitleId':'FC-G004369','platform':'FC','title':'スウィートホーム','limit':'12'}, lambda d:isinstance(d.get('posts'),list) and isinstance(d.get('articles'),list))
          bench('title_content_search_sweethome', {'action':'title_content_search','sharedTitleId':'FC-G004369','platform':'FC','title':'スウィートホーム','limit':'30','offset':'0'}, lambda d:isinstance(d.get('items'),list))
          bench('game_review_list_sweethome', {'action':'game_review_list','sharedTitleId':'FC-G004369','platform':'FC','title':'スウィートホーム','limit':'100'}, lambda d:isinstance(d.get('reviews'),list))
          bench('pt_coupon_user_state_empty', {'action':'pt_coupon_user_state','userId':'github_readonly_bench_0912'}, lambda d:isinstance(d.get('requests'),list))

          print('\n=== BENCHMARK_JSON ===')
          print(json.dumps({'expected_version':EXPECT,'article_id':article_id,'parent_id':parent_id,'results':RESULTS}, ensure_ascii=False, indent=2))

          bad=[r for r in RESULTS if r.get('fail',0)>0]
          if status.get('version')!=EXPECT or bad:
              print('\nBENCHMARK_COMPLETED_WITH_FAILURES=',len(bad))
              sys.exit(2)
          print('\nBENCHMARK_OK')
          PY
