name: MiteKore Inventory Live Concurrency Benchmark
on:
  push:
    paths:
      - '.github/workflows/mitekore-inventory-concurrency-live.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run live concurrency benchmark
        shell: bash
        run: |
          cat > /tmp/livebench.py <<'PY'
          import subprocess, urllib.parse, json, time, re, html, hashlib, statistics, concurrent.futures

          MITE='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          INV='https://script.google.com/macros/s/AKfycbxoqua0rvTXWabQSPYnJ9wvjYP8EZ0L5i-PlAwZclreciDwtmAS6dJeBXNjJrScqijm1A/exec'
          INV_WRITE_KEY='hPHBjEyL6yDgXDkZN78v3BoSjfe_LGDg'
          APP='20.2.35.652'
          TS=str(int(time.time()*1000))
          USER='github_concurrency_'+TS
          SYNC='mk_'+hashlib.sha256(('concurrency-'+TS).encode()).hexdigest()[:40]
          rows=[]

          def parse_body(body):
              raw=(body or '').strip()
              try: return json.loads(raw)
              except: pass
              m=re.match(r'^[A-Za-z_$][A-Za-z0-9_$.]*\((.*)\)\s*;?\s*$',raw,re.S)
              if m:
                  try:return json.loads(m.group(1))
                  except:pass
              # inventory / mitekore iframe postMessage forms
              for pat in [r'parent\.postMessage\((\{.*?\}),\s*["\']\*["\']\s*\)', r'window\.parent\.postMessage\((\{.*?\}),\s*["\']\*["\']\s*\)']:
                  m=re.search(pat,raw,re.S)
                  if m:
                      try:return json.loads(m.group(1))
                      except:pass
              m=re.search(r'<pre[^>]*>(.*?)</pre>',raw,re.S|re.I)
              if m:
                  try:return json.loads(html.unescape(m.group(1)).strip())
                  except:pass
              return None

          def curl_get(url,params,timeout=180):
              q=dict(params);q['_']=str(int(time.time()*1000))
              full=url+'?'+urllib.parse.urlencode(q)
              p=subprocess.run(['curl','-L','--max-time',str(timeout),'-sS','-w','\n__METRIC__%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}',full],capture_output=True,text=True)
              out=p.stdout
              if '\n__METRIC__' in out: body,metric=out.rsplit('\n__METRIC__',1)
              else: body,metric=out,'ERR|0|0|0'
              z=metric.strip().split('|')
              return {'http':z[0] if z else 'ERR','seconds':float(z[1] or 0) if len(z)>1 else 0,'ttfb':float(z[2] or 0) if len(z)>2 else 0,'bytes':int(float(z[3] or 0)) if len(z)>3 else 0,'body':body,'data':parse_body(body)}

          def curl_post(url,fields,timeout=240):
              cmd=['curl','-L','--max-time',str(timeout),'-sS','-w','\n__METRIC__%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}']
              for k,v in fields.items(): cmd += ['--data-urlencode',str(k)+'='+str(v)]
              cmd.append(url)
              p=subprocess.run(cmd,capture_output=True,text=True)
              out=p.stdout
              if '\n__METRIC__' in out: body,metric=out.rsplit('\n__METRIC__',1)
              else: body,metric=out,'ERR|0|0|0'
              z=metric.strip().split('|')
              return {'http':z[0] if z else 'ERR','seconds':float(z[1] or 0) if len(z)>1 else 0,'ttfb':float(z[2] or 0) if len(z)>2 else 0,'bytes':int(float(z[3] or 0)) if len(z)>3 else 0,'body':body,'data':parse_body(body)}

          def brief(r):
              d=r.get('data')
              if isinstance(d,dict):
                  return {k:d.get(k) for k in ['ok','action','version','message','code','processing','contentionAvoided','reason','status','pending','record_count','revision'] if k in d}
              return {'preview':re.sub(r'\s+',' ',r.get('body',''))[:180]}

          def log(label,r,phase='',delay=None):
              row={'label':label,'phase':phase,'delay':delay,'http':r['http'],'seconds':r['seconds'],'ttfb':r['ttfb'],'bytes':r['bytes'],'result':brief(r)}
              rows.append(row)
              print('LIVE|'+label+'|'+phase+'|'+str(delay)+'|'+r['http']+'|'+f"{r['seconds']:.3f}"+'|'+json.dumps(row['result'],ensure_ascii=False),flush=True)
              return r

          # Version gates — never write unless both new versions are public.
          mite_status=log('mite_status',curl_get(MITE,{'action':'status'},60),'gate')
          inv_ping=log('inv_ping',curl_get(INV,{'action':'ping'},60),'gate')
          mv=str((mite_status.get('data') or {}).get('version',''))
          iv=str((inv_ping.get('data') or {}).get('version',''))
          print('VERSIONS|mite='+mv+'|inventory='+iv,flush=True)
          if mv!='3.12.32' or iv!='2.9.12':
              print('ABORT_VERSION_MISMATCH',flush=True)
              with open('mitekore-inventory-concurrency-live.json','w',encoding='utf-8') as f:json.dump({'aborted':True,'miteVersion':mv,'inventoryVersion':iv,'rows':rows},f,ensure_ascii=False,indent=2)
              raise SystemExit(0)

          # Existing real master row; we re-submit the exact same values, so business data is not intentionally changed.
          lookup=log('inv_lookup_starfox',curl_get(INV,{'action':'title_lookup','title':'スターフォックス','platform':'SFC'},120),'setup')
          ld=lookup.get('data') or {}; item=ld.get('masterItem') if isinstance(ld,dict) else None
          if not isinstance(item,dict) or not item.get('productMasterId'):
              print('ABORT_MASTER_NOT_FOUND',json.dumps(ld,ensure_ascii=False)[:1000],flush=True)
              with open('mitekore-inventory-concurrency-live.json','w',encoding='utf-8') as f:json.dump({'aborted':True,'reason':'master_not_found','rows':rows},f,ensure_ascii=False,indent=2)
              raise SystemExit(0)

          print('MASTER|'+json.dumps({k:item.get(k) for k in item.keys() if k not in ['imageData']},ensure_ascii=False)[:1600],flush=True)

          def itemval(*keys):
              for k in keys:
                  if k in item and item.get(k) is not None:return item.get(k)
              return ''

          def inventory_update(round_no):
              fields={
                'action':'product_master_upsert','requestId':'inv_live_'+TS+'_'+str(round_no),'write_request_key':'live_'+TS+'_'+str(round_no),
                'write_key':INV_WRITE_KEY,'mode':'update','product_master_id':itemval('productMasterId','product_master_id'),
                'shared_title_id':itemval('sharedTitleId','shared_title_id'),'platform':itemval('platform'),'title':itemval('title'),
                'edition_label':itemval('editionLabel','edition_label'),'jan':itemval('jan'),'model':itemval('model'),'maker':itemval('maker'),
                'release_date':itemval('releaseDate','release_date'),'genre':itemval('genre'),'image_url':itemval('imageUrl','image_url'),
                'image_source':itemval('imageSource','image_source'),'source_label':'GitHub競合実測・同値更新'
              }
              return curl_post(INV,fields,240)

          def title_summary(tag):
              return curl_get(MITE,{'action':'title_summary','platform':'FC','title':'スーパーマリオブラザーズ','canonicalTitle':'スーパーマリオブラザーズ'},180)

          def collection_sync(tag):
              payload=json.dumps({'app':'fujiya_collection','version':APP,'exportedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'userId':USER,'purchasePriceShared':0,'records':[]},ensure_ascii=False,separators=(',',':'))
              return curl_post(MITE,{'action':'collection_sync_frame','requestId':'coll_'+TS+'_'+tag,'appVersion':APP,'payload':payload},180)

          def device_push(tag):
              payload=json.dumps({'app':'fujiya_device_sync','version':3,'syncKey':SYNC,'expectedRevision':0,'userId':USER,'appVersion':APP,'deviceId':'bench_'+tag,'deviceName':'GitHub Concurrency','records':[]},ensure_ascii=False,separators=(',',':'))
              return curl_post(MITE,{'action':'device_sync_push_frame','requestId':'dev_'+TS+'_'+tag,'appVersion':APP,'payload':payload},180)

          def device_pull(tag):
              return curl_get(MITE,{'action':'device_sync_pull','syncKey':SYNC,'clientVersion':'3','userId':USER,'appVersion':APP},180)

          # Baseline on the same deployment, no inventory write in flight.
          log('baseline_title_summary',title_summary('base'),'baseline')
          log('baseline_collection_sync',collection_sync('base'),'baseline')
          log('baseline_device_push',device_push('base'),'baseline')
          log('baseline_device_pull',device_pull('base'),'baseline')

          # Live collision rounds. Different offsets catch the busy lease at different points.
          for round_no,delay in enumerate([0.15,0.60,1.20],1):
              print(f'ROUND_START|{round_no}|delay={delay}',flush=True)
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
                  invf=ex.submit(inventory_update,round_no)
                  time.sleep(delay)
                  started=time.time()
                  futs={
                    'title_summary':ex.submit(title_summary,'r'+str(round_no)),
                    'collection_sync':ex.submit(collection_sync,'r'+str(round_no)),
                    'device_push':ex.submit(device_push,'r'+str(round_no)),
                    'device_pull':ex.submit(device_pull,'r'+str(round_no)),
                  }
                  for name,f in futs.items():
                      try:r=f.result(timeout=190)
                      except Exception as e:r={'http':'ERR','seconds':0,'ttfb':0,'bytes':0,'body':str(e),'data':None}
                      log('concurrent_'+name+'_r'+str(round_no),r,'concurrent',delay)
                  try:ir=invf.result(timeout=250)
                  except Exception as e:ir={'http':'ERR','seconds':0,'ttfb':0,'bytes':0,'body':str(e),'data':None}
                  log('inventory_update_r'+str(round_no),ir,'inventory',delay)
                  if isinstance(ir.get('data'),dict) and ir['data'].get('performance'):
                      print('INVPERF|'+str(round_no)+'|'+json.dumps(ir['data'].get('performance'),ensure_ascii=False),flush=True)
              time.sleep(1.0)

          # A final no-inventory recheck to separate contention from random GAS stalls.
          log('after_title_summary',title_summary('after'),'after')
          log('after_collection_sync',collection_sync('after'),'after')
          log('after_device_pull',device_pull('after'),'after')

          # Cleanup synthetic MiteKore data. This is intentionally outside measured rows.
          try:
              req='cleanup_'+TS
              curl_post(MITE,{'action':'reset_user_collection_frame','requestId':req,'userId':USER,'appVersion':APP},240)
          except: pass

          def sec(label): return [r['seconds'] for r in rows if r['label']==label]
          out={'aborted':False,'miteVersion':mv,'inventoryVersion':iv,'syntheticUser':USER,'syncKey':SYNC,'rows':rows}
          with open('mitekore-inventory-concurrency-live.json','w',encoding='utf-8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          PY
          python3 /tmp/livebench.py
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-inventory-concurrency-live
          path: mitekore-inventory-concurrency-live.json
