name: TEMP verify GAS 3.12.41 cloud backup
on:
  push:
    paths:
      - '.github/workflows/temp-cloud-backup-31241-test.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose live GAS URL
        shell: bash
        run: |
          set -u
          URL='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          echo '--- first response ---'
          curl -sS --max-time 60 -D /tmp/headers -o /tmp/body "$URL?action=status" || true
          cat /tmp/headers || true
          head -c 1000 /tmp/body || true
          echo
          echo '--- follow redirects ---'
          CODE=$(curl -sS -L --max-time 90 --max-redirs 10 -o /tmp/final -w '%{http_code}' "$URL?action=status" || true)
          echo "HTTP=$CODE"
          head -c 3000 /tmp/final || true
          echo
          if [ "$CODE" != "200" ]; then exit 2; fi
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/final'))
          print('PARSED_VERSION='+str(data.get('version')))
          if data.get('version')!='3.12.41': raise SystemExit('live GAS version mismatch')
          PY
