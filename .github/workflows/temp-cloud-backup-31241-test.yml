name: TEMP verify GAS 3.12.41 cloud backup
on:
  push:
    paths:
      - '.github/workflows/temp-cloud-backup-31241-test.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test live GAS cloud backup save pull cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time

          URL='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          APP='RC1.4.653-premium-cloud-backup'
          USER='fujiya_test_cloud_31241_20260903'
          KEY='mk_TESTCLOUD31241A2B3C4D5E6F7G8H9J0KLMN'
          DEVICE='test_cloud_31241_device'

          def curl(args, timeout=120):
              cmd=['curl','-sS','-L','--max-time',str(timeout)] + args
              out=subprocess.check_output(cmd, text=True)
              return out

          def get(params, timeout=90):
              args=['--get',URL]
              for k,v in params.items(): args += ['--data-urlencode', f'{k}={v}']
              out=curl(args,timeout)
              try: return json.loads(out)
              except Exception: raise RuntimeError('non-json GET: '+out[:1000])

          def post(params, timeout=120):
              args=[URL]
              for k,v in params.items(): args += ['--data-urlencode', f'{k}={v}']
              return curl(args,timeout)

          def push(expected, records, reqid):
              payload={
                'app':'fujiya_device_sync','version':3,'syncKey':KEY,'expectedRevision':int(expected),
                'deviceId':DEVICE,'deviceName':'GAS 3.12.41 cloud test','userId':USER,'appVersion':APP,'records':records
              }
              post({'action':'device_sync_push_frame','requestId':reqid,'appVersion':APP,'payload':json.dumps(payload,separators=(',',':'),ensure_ascii=False)},150)
              last=None
              for _ in range(45):
                  time.sleep(1)
                  last=get({'action':'device_sync_status','requestId':reqid},45)
                  if not last.get('pending'):
                      if last.get('ok') is not True: raise RuntimeError('push failed: '+json.dumps(last,ensure_ascii=False))
                      return last
              raise RuntimeError('push timeout: '+json.dumps(last,ensure_ascii=False))

          status=get({'action':'status'})
          print('STATUS',json.dumps(status,ensure_ascii=False))
          assert status.get('version')=='3.12.41'

          member=get({'action':'member_access','userId':USER,'appVersion':APP})
          print('MEMBER',json.dumps(member,ensure_ascii=False))
          assert member.get('ok') is True
          assert member.get('access',{}).get('capabilities',{}).get('cloudBackup') is True

          initial=get({'action':'cloud_backup_pull','backupKey':KEY,'appVersion':APP})
          print('INITIAL_PULL',json.dumps(initial,ensure_ascii=False))
          rev=int(initial.get('revision') or 0)

          now='2026-09-03T20:32:00+09:00'
          backup={'app':'fujiya_collection','backupType':'full-json','versionLabel':'live-test-3.12.41','exportedAt':now,'entries':[{'id':'synthetic_game_A','title':'TEST ONLY'}],'settings':{'userId':USER}}
          text=json.dumps(backup,separators=(',',':'),ensure_ascii=False)
          checksum='live-test-checksum-'+str(len(text))
          records=[
            {'id':'__mitekore_cloud_full_backup_meta_v1__','updatedAt':now,'deletedAt':'','deviceId':DEVICE,'data':{'kind':'cloud_full_backup_meta_v1','schema':1,'ownerUserId':USER,'exportedAt':now,'entryCount':1,'chunkCount':1,'charLength':len(text),'checksum':checksum,'backupType':'full-json','versionLabel':'live-test-3.12.41','emailHint':'te***@example.invalid'}},
            {'id':'__mitekore_cloud_full_backup_chunk_v1__:00000','updatedAt':now,'deletedAt':'','deviceId':DEVICE,'data':{'kind':'cloud_full_backup_chunk_v1','part':0,'total':1,'text':text}}
          ]

          saved=False
          try:
              p=push(rev,records,'cloud31241save20260903b')
              saved=True
              print('SAVE_STATUS',json.dumps(p,ensure_ascii=False))
              pulled=get({'action':'cloud_backup_pull','backupKey':KEY,'appVersion':APP})
              print('PULL_AFTER_SAVE',json.dumps(pulled,ensure_ascii=False))
              assert pulled.get('ok') is True
              assert pulled.get('version')=='3.12.41'
              assert pulled.get('exists') is True
              assert int(pulled.get('record_count') or 0)==2
              assert int(pulled.get('backup',{}).get('entryCount') or 0)==1
              meta=[r for r in pulled.get('records',[]) if r.get('id')=='__mitekore_cloud_full_backup_meta_v1__'][0]
              assert meta.get('data',{}).get('ownerUserId')==USER
              rev=int(pulled.get('revision') or p.get('revision') or 0)
              print('VERIFY_OK version=3.12.41 save=true pull=true revision='+str(rev))
          finally:
              try:
                  cur=get({'action':'cloud_backup_pull','backupKey':KEY,'appVersion':APP})
                  currev=int(cur.get('revision') or rev or 0)
                  c=push(currev,[],'cloud31241cleanup20260903b')
                  print('CLEANUP_STATUS',json.dumps(c,ensure_ascii=False))
                  after=get({'action':'cloud_backup_pull','backupKey':KEY,'appVersion':APP})
                  print('PULL_AFTER_CLEANUP',json.dumps(after,ensure_ascii=False))
                  assert after.get('exists') is False
              except Exception as e:
                  print('CLEANUP_ERROR',repr(e))
                  if saved: raise
          PY
