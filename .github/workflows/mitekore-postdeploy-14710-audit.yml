name: MiteKore Postdeploy 14710 Audit
on:
  push:
    paths:
      - '.github/workflows/mitekore-postdeploy-14710-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare browser
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Verify mobile home global search
        env:
          APP_URL: https://hilarious-haupia-6e0406.netlify.app/
          GAS_URL: https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const APP=process.env.APP_URL,GAS=process.env.GAS_URL,RUN=String(process.env.GITHUB_RUN_ID||Date.now());
          (async()=>{const browser=await chromium.launch({headless:true});try{
            const c=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await c.addInitScript(({uid,gas})=>{localStorage.setItem('fujiya_collection_user_id',uid);localStorage.setItem('fujiya_mitereco_identity_user_v2',uid);localStorage.setItem('fujiya_collection_setup_done_v1','1');localStorage.setItem('fujiya_collection_tutorial_seen_v2_rc1474','1');localStorage.setItem('fujiya_collection_first_run_seen_v20_2_35cn','1');localStorage.setItem('fujiya_collection_gas_endpoint',gas);},{uid:'fujiya_chatgpt_mobilehome_'+RUN,gas:GAS});
            const p=await c.newPage();p.setDefaultTimeout(25000);await p.goto(APP,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(7000);
            const marker=await p.evaluate(()=>window.__FUJIYA_AUTHORITATIVE_PT_LIKE_14710__===true);if(!marker)throw new Error('14710 marker missing');
            const buttons=p.locator('[data-global-search-open596]:visible');const n=await buttons.count();if(!n)throw new Error('mobile home global search button missing');
            let target=buttons.filter({hasText:'全体検索'}).first();if(!await target.count())target=buttons.first();await target.click({force:true});await p.waitForTimeout(300);
            const input=p.locator('#globalSearchInput596:visible');if(!await input.count())throw new Error('global search modal did not open');
            console.log('PASS mobile home global search',{visibleButtons:n,opened:true});
          }finally{await browser.close()}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
