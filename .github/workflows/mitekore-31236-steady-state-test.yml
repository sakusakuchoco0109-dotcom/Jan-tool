name: MiteKore 3.12.36 Steady State Test
on:
  push:
    paths:
      - '.github/workflows/mitekore-31236-steady-state-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run steady state concurrency benchmark
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess, urllib.parse, json, re, time, random, concurrent.futures, statistics
          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          RUN=str(int(time.time()))+str(random.randint(1000,9999)); users=[]

          def curl(url, form=None, timeout=60):
            cmd=['curl','-L','--connect-timeout','10','--max-time',str(timeout),'-sS','-w','\n__META__%{http_code}|%{time_total}|%{time_starttransfer}']
            if form is not None:
              for k,v in form.items(): cmd += ['--data-urlencode',f'{k}={v}']
            cmd += [url]
            p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            if p.returncode:return 0,float(timeout),p.stdout,{'timeout':p.returncode==28,'stderr':p.stderr.strip()[:200]}
            body,meta=p.stdout.rsplit('\n__META__',1);code,total,_=meta.strip().split('|');return int(code),float(total),body,{}

          def get_json(action,params=None,timeout=60):
            q=dict(params or {});q['action']=action;q['_']=str(time.time_ns())
            code,sec,body,err=curl(GAS+'?'+urllib.parse.urlencode(q),timeout=timeout)
            if err:return code,sec,{'ok':False,'code':'TRANSPORT_TIMEOUT' if err.get('timeout') else 'TRANSPORT_ERROR','message':err.get('stderr')}
            try:return code,sec,json.loads(body)
            except:return code,sec,{'ok':False,'code':'JSON_PARSE_FAILED','message':body[:180]}

          def parse_pm(body):
            m=re.search(r'window\.parent\.postMessage\((\{.*?\}),\s*["\']\*["\']\)',body,re.S)
            if m:
              try:return json.loads(m.group(1)).get('payload') or {}
              except:pass
            return {'ok':False,'code':'POSTMESSAGE_PARSE_FAILED','message':body[:180]}

          def post_frame(action,fields,rid,timeout=70):
            form={'action':action,'requestId':rid};form.update(fields)
            code,sec,body,err=curl(GAS,form=form,timeout=timeout)
            if err:return code,sec,{'ok':False,'code':'TRANSPORT_TIMEOUT' if err.get('timeout') else 'TRANSPORT_ERROR','message':err.get('stderr')}
            return code,sec,parse_pm(body)

          def poll(action,rid,tries=6):
            last={}
            for _ in range(tries):
              _,sec,last=get_json(action,{'requestId':rid},timeout=40)
              if last.get('status') in ('completed','error') or last.get('pending') is False:return last
              time.sleep(.6)
            return last

          def busy(d):
            s=(str(d.get('code',''))+' '+str(d.get('message',''))).upper();return 'BUSY' in s or '混み合' in s or '自動再試行' in s

          # Warm endpoint 3x.
          sts=[]; st={}
          for i in range(3):
            _,sec,st=get_json('status',timeout=60);sts.append(sec);print('STATUS_%d|sec=%.3f|version=%s|ok=%s'%(i+1,sec,st.get('version'),st.get('ok')));time.sleep(.5)
          if st.get('version')!='3.12.36':print('FINAL|abort=VERSION');raise SystemExit(0)

          # Pre-create four users sequentially, then measure sequential update baseline on existing rows.
          base=['loadtest_steady_%s_%d'%(RUN,i) for i in range(4)];users+=base
          create_times=[]
          for u in base:
            _,sec,d=get_json('share_preference_set',{'userId':u,'enabled':'1','price_enabled':'1'},timeout=50);create_times.append(sec);print('PRECREATE|sec=%.3f|ok=%s|code=%s'%(sec,d.get('ok'),d.get('code')))
          seq=[]
          for u in base:
            _,sec,d=get_json('share_preference_set',{'userId':u,'enabled':'0','price_enabled':'1'},timeout=50);seq.append(sec)
          print('SHARE_SEQ_EXISTING|n=4|median=%.3f|max=%.3f'%(statistics.median(seq),max(seq)))

          def share_existing(u):
            hist=[];t=time.time()
            for a in range(4):
              _,sec,d=get_json('share_preference_set',{'userId':u,'enabled':'1','price_enabled':'1'},timeout=50);hist.append({'sec':sec,'ok':d.get('ok'),'code':d.get('code')})
              if d.get('ok') is True:return {'ok':True,'attempts':a+1,'wall':time.time()-t,'hist':hist}
              if not busy(d):return {'ok':False,'attempts':a+1,'wall':time.time()-t,'hist':hist}
              if a<3:time.sleep([.65,1.0,1.5][a]+random.random()*.25)
            return {'ok':False,'attempts':4,'wall':time.time()-t,'hist':hist}
          t=time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex: sr=list(ex.map(share_existing,base))
          print('SHARE4_EXISTING|success=%d/4|wall=%.3f|median_client=%.3f|max_client=%.3f|max_attempts=%d'%(sum(x['ok'] for x in sr),time.time()-t,statistics.median(x['wall'] for x in sr),max(x['wall'] for x in sr),max(x['attempts'] for x in sr)))
          for x in sr:
            if x['attempts']>1 or not x['ok']:print('SHARE4_EXISTING_DETAIL|'+json.dumps(x,separators=(',',':')))
          time.sleep(2)

          def col(u,idx):
            payload=json.dumps({'app':'fujiya_collection','userId':u,'records':[]},separators=(',',':'));hist=[];t=time.time()
            for a in range(1,5):
              rid='loadtest_steady_col_%s_%d_%d'%(RUN,idx,a)
              _,sec,d=post_frame('collection_sync_frame',{'payload':payload},rid,timeout=60)
              if d.get('ok') is not True:
                p=poll('collection_sync_status',rid,5)
                if p:d=p
              hist.append({'attempt':a,'sec':sec,'ok':d.get('ok'),'status':d.get('status'),'code':d.get('code')})
              if d.get('ok') is True and d.get('status') in (None,'completed'):return {'ok':True,'attempts':a,'wall':time.time()-t,'hist':hist}
              if not busy(d) and d.get('code') not in ('POSTMESSAGE_PARSE_FAILED','JSON_PARSE_FAILED','TRANSPORT_TIMEOUT'):return {'ok':False,'attempts':a,'wall':time.time()-t,'hist':hist}
              if a<4:time.sleep([.65,1.0,1.5][a-1]+random.random()*.25)
            return {'ok':False,'attempts':4,'wall':time.time()-t,'hist':hist}

          # Sequential collection baseline on existing users.
          cseq=[]
          for i,u in enumerate(base):
            r=col(u,100+i);cseq.append(r['wall'])
          print('COL_SEQ_EXISTING|n=4|success=%d/4|median=%.3f|max=%.3f'%(sum(1 for x in cseq if x>=0),statistics.median(cseq),max(cseq)))
          time.sleep(2)
          t=time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex: cr=list(ex.map(lambda q:col(q[1],200+q[0]),enumerate(base)))
          print('COL4_EXISTING|success=%d/4|wall=%.3f|median_client=%.3f|max_client=%.3f|max_attempts=%d'%(sum(x['ok'] for x in cr),time.time()-t,statistics.median(x['wall'] for x in cr),max(x['wall'] for x in cr),max(x['attempts'] for x in cr)))
          for x in cr:
            if x['attempts']>1 or not x['ok']:print('COL4_EXISTING_DETAIL|'+json.dumps(x,ensure_ascii=False,separators=(',',':')))

          # Cleanup.
          rid='loadtest_steady_cleanup_'+RUN
          _,postsec,_=post_frame('account_delete_frame',{'confirm':'DELETE_ACCOUNT','userIds':json.dumps(users,separators=(',',':'))},rid,timeout=180)
          clean=poll('account_delete_status',rid,8)
          print('CLEANUP|post_sec=%.3f|status=%s|deleted_users=%s|remaining=%s|expected=%d'%(postsec,clean.get('status'),clean.get('deleted_users'),clean.get('remaining_records'),len(set(users))))
          print('FINAL|share4=%d/4|col4=%d/4|cleanup=%s'%(sum(x['ok'] for x in sr),sum(x['ok'] for x in cr),clean.get('status')))
          PY
