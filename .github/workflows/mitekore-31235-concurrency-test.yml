name: MiteKore 3.12.35 Concurrency Test
on:
  push:
    paths:
      - '.github/workflows/mitekore-31235-concurrency-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run live concurrency test
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess, urllib.parse, json, re, time, random, statistics, concurrent.futures

          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          APP='https://hilarious-haupia-6e0406.netlify.app/'
          EXPECTED_GAS='3.12.35'; EXPECTED_HTML='RC1.4.641-concurrent-write'
          RUN=str(int(time.time()))+str(random.randint(1000,9999))
          users=[]

          def curl(url, method='GET', form=None, timeout=45, headers=None):
            cmd=['curl','-L','--connect-timeout','10','--max-time',str(timeout),'-sS','-w','\n__META__%{http_code}|%{time_total}|%{time_starttransfer}']
            for h in headers or []: cmd += ['-H',h]
            if method=='POST':
              cmd += ['-X','POST']
              for k,v in (form or {}).items(): cmd += ['--data-urlencode', f'{k}={v}']
            cmd += [url]
            p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            if p.returncode != 0:
              return 0,float(timeout),float(timeout),p.stdout,{'timeout':p.returncode==28,'curl_code':p.returncode,'stderr':p.stderr.strip()[:200]}
            try:
              body,meta=p.stdout.rsplit('\n__META__',1); code,total,ttfb=meta.strip().split('|')
              return int(code),float(total),float(ttfb),body,{}
            except Exception as e:
              return 0,0,0,p.stdout,{'parse_error':str(e)}

          def get_json(action, params=None, timeout=45):
            q=dict(params or {});q['action']=action;q['_']=str(time.time_ns())
            code,total,ttfb,body,err=curl(GAS+'?'+urllib.parse.urlencode(q),timeout=timeout)
            if err:return code,total,ttfb,{'ok':False,'code':'TRANSPORT_TIMEOUT' if err.get('timeout') else 'TRANSPORT_ERROR','message':err.get('stderr','transport error')}
            try:data=json.loads(body)
            except:data={'ok':False,'code':'JSON_PARSE_FAILED','message':body[:200]}
            return code,total,ttfb,data

          def parse_pm(body):
            m=re.search(r'window\.parent\.postMessage\((\{.*?\}),\s*"\*"\)',body,re.S)
            if not m:return {'ok':False,'code':'POSTMESSAGE_PARSE_FAILED','message':body[:200]}
            try:return json.loads(m.group(1)).get('payload') or {}
            except Exception as e:return {'ok':False,'code':'POSTMESSAGE_JSON_FAILED','message':str(e)}

          def post_frame(action, fields, request_id, timeout=60):
            form={'action':action,'requestId':request_id};form.update(fields or {})
            code,total,ttfb,body,err=curl(GAS,method='POST',form=form,timeout=timeout)
            if err:return code,total,ttfb,{'ok':False,'code':'TRANSPORT_TIMEOUT' if err.get('timeout') else 'TRANSPORT_ERROR','message':err.get('stderr','transport error')}
            return code,total,ttfb,parse_pm(body)

          def is_busy(data, family=''):
            text=(str(data.get('code',''))+' '+str(data.get('message',''))).upper()
            return 'BUSY' in text or '混み合' in text or '自動再試行' in text

          def cleanup(ids,label):
            ids=list(dict.fromkeys([x for x in ids if x]))
            if not ids:return {'ok':True,'deleted_users':0,'remaining_records':0}
            rid='loadtest_cleanup_'+label+'_'+RUN
            code,sec,ttfb,data=post_frame('account_delete_frame',{'confirm':'DELETE_ACCOUNT','userIds':json.dumps(ids,separators=(',',':'))},rid,timeout=180)
            print('CLEANUP_%s|http=%s|sec=%.3f|ok=%s|deleted_users=%s|remaining=%s|code=%s|message=%s'%(label,code,sec,data.get('ok'),data.get('deleted_users'),data.get('remaining_records'),data.get('code'),data.get('message')))
            if data.get('ok') is not True:
              time.sleep(4)
              sc,ss,st,status=get_json('account_delete_status',{'requestId':rid},timeout=45)
              print('CLEANUP_%s_STATUS|http=%s|sec=%.3f|ok=%s|status=%s|remaining=%s|code=%s|message=%s'%(label,sc,ss,status.get('ok'),status.get('status'),status.get('remaining_records'),status.get('code'),status.get('message')))
              if status.get('status')=='completed':return status
            return data

          # Cleanup residue from the previous aborted runner first.
          cleanup(['loadtest_share_17884136005496'],'STALE')

          # Verify deployment, with repeated status probes because first cold request can be slow.
          probes=[]; status={}
          for i in range(3):
            code,sec,ttfb,status=get_json('status',timeout=60);probes.append(sec)
            print('VERIFY_GAS_%d|http=%s|sec=%.3f|version=%s|ok=%s|code=%s'%(i+1,code,sec,status.get('version'),status.get('ok'),status.get('code')))
            if status.get('version')==EXPECTED_GAS: break
          c,t,tf,html,err=curl(APP+'?loadtest='+RUN,timeout=30,headers=['Cache-Control: no-cache','Pragma: no-cache'])
          html_ok=(EXPECTED_HTML in html)
          print('VERIFY_HTML|http=%s|sec=%.3f|marker=%s|transport=%s'%(c,t,html_ok,err or 'ok'))
          if status.get('version')!=EXPECTED_GAS:
            print('FINAL|abort=GAS_VERSION_MISMATCH'); raise SystemExit(0)

          # Share-preference burst test at increasing concurrency. Each level uses its own user.
          share_results={}
          for n in (2,4,8):
            uid='loadtest_share%d_%s'%(n,RUN);users.append(uid)
            def one(i):
              code,sec,ttfb,data=get_json('share_preference_set',{'userId':uid,'enabled':'1' if i%2 else '0','price_enabled':'1' if i%3 else '0'},timeout=35)
              return {'i':i,'http':code,'sec':sec,'ok':data.get('ok') is True,'busy':is_busy(data),'code':data.get('code'),'message':data.get('message')}
            t0=time.time()
            with concurrent.futures.ThreadPoolExecutor(max_workers=n) as ex: rows=list(ex.map(one,range(n)))
            share_results[n]=rows
            secs=[r['sec'] for r in rows]
            print('SHARE_%d|ok=%d/%d|busy=%d|timeouts=%d|other=%d|wall=%.3f|median=%.3f|max=%.3f'%(n,sum(r['ok'] for r in rows),n,sum(r['busy'] for r in rows),sum(r['code']=='TRANSPORT_TIMEOUT' for r in rows),sum((not r['ok'] and not r['busy'] and r['code']!='TRANSPORT_TIMEOUT') for r in rows),time.time()-t0,statistics.median(secs),max(secs)))
            for r in rows:
              if not r['ok']: print('SHARE_%d_DETAIL|%s'%(n,json.dumps(r,ensure_ascii=False,separators=(',',':'))))
            time.sleep(3)

          # Browser-equivalent retry for 4 simultaneous share users (distinct users, same global lock).
          retry_users=['loadtest_shareretry_%s_%d'%(RUN,i) for i in range(4)];users.extend(retry_users)
          def share_client(uid):
            hist=[];wall0=time.time()
            for attempt in range(4):
              code,sec,ttfb,data=get_json('share_preference_set',{'userId':uid,'enabled':'1','price_enabled':'1'},timeout=35)
              hist.append({'sec':sec,'ok':data.get('ok'),'code':data.get('code'),'message':data.get('message')})
              if data.get('ok') is True:return {'uid':uid,'ok':True,'attempts':attempt+1,'wall':time.time()-wall0,'history':hist}
              if data.get('code')=='TRANSPORT_TIMEOUT':
                # A timeout may still have committed. Check state before retrying.
                _,_,_,state=get_json('share_preference_get',{'userId':uid},timeout=35)
                if state.get('enabled') is True:return {'uid':uid,'ok':True,'attempts':attempt+1,'wall':time.time()-wall0,'history':hist,'recovered_by_read':True}
              if not is_busy(data) and data.get('code')!='TRANSPORT_TIMEOUT':return {'uid':uid,'ok':False,'attempts':attempt+1,'wall':time.time()-wall0,'history':hist}
              if attempt<3:time.sleep(min(2.2,0.5*(1.7**attempt)+0.15))
            return {'uid':uid,'ok':False,'attempts':4,'wall':time.time()-wall0,'history':hist}
          t0=time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex: share_retry=list(ex.map(share_client,retry_users))
          print('SHARE_RETRY4|success=%d/4|wall=%.3f|max_attempts=%d|max_client=%.3f'%(sum(x['ok'] for x in share_retry),time.time()-t0,max(x['attempts'] for x in share_retry),max(x['wall'] for x in share_retry)))
          for x in share_retry:
            if not x['ok'] or x['attempts']>1:print('SHARE_RETRY4_DETAIL|'+json.dumps(x,ensure_ascii=False,separators=(',',':')))
          time.sleep(3)

          # Collection sync, exact client retry policy, 2 then 4 simultaneous users.
          def collection_client(uid,idx):
            payload=json.dumps({'app':'fujiya_collection','userId':uid,'records':[]},separators=(',',':'))
            hist=[];wall0=time.time()
            for attempt in range(1,5):
              rid='loadtest_col_%s_%d_%d'%(RUN,idx,attempt)
              code,sec,ttfb,data=post_frame('collection_sync_frame',{'payload':payload},rid,timeout=50)
              hist.append({'sec':sec,'ok':data.get('ok'),'code':data.get('code'),'message':data.get('message')})
              if data.get('ok') is True:return {'uid':uid,'ok':True,'attempts':attempt,'wall':time.time()-wall0,'history':hist}
              if data.get('code')=='TRANSPORT_TIMEOUT':
                _,_,_,st=get_json('collection_sync_status',{'requestId':rid},timeout=35)
                if st.get('status')=='completed' and st.get('ok') is True:return {'uid':uid,'ok':True,'attempts':attempt,'wall':time.time()-wall0,'history':hist,'recovered_by_status':True}
              if not is_busy(data) and data.get('code')!='TRANSPORT_TIMEOUT':return {'uid':uid,'ok':False,'attempts':attempt,'wall':time.time()-wall0,'history':hist}
              if attempt<4:time.sleep(1.2 if attempt==1 else 2.5)
            return {'uid':uid,'ok':False,'attempts':4,'wall':time.time()-wall0,'history':hist}

          colsets={}
          for n in (2,4):
            ids=['loadtest_col%d_%s_%d'%(n,RUN,i) for i in range(n)];users.extend(ids)
            t0=time.time()
            with concurrent.futures.ThreadPoolExecutor(max_workers=n) as ex: rows=list(ex.map(lambda x:collection_client(x[1],n*100+x[0]),enumerate(ids)))
            colsets[n]=rows
            print('COLLECTION_%d|success=%d/%d|wall=%.3f|max_attempts=%d|max_client=%.3f'%(n,sum(x['ok'] for x in rows),n,time.time()-t0,max(x['attempts'] for x in rows),max(x['wall'] for x in rows)))
            for x in rows:
              if not x['ok'] or x['attempts']>1:print('COLLECTION_%d_DETAIL|%s'%(n,json.dumps(x,ensure_ascii=False,separators=(',',':'))))
            time.sleep(4)

          # Mixed feature contention: one collection sync + three unrelated share writes.
          mixed_sync='loadtest_mixedcol_'+RUN;users.append(mixed_sync)
          mixed_shares=['loadtest_mixedshare_%s_%d'%(RUN,i) for i in range(3)];users.extend(mixed_shares)
          t0=time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            fs=[ex.submit(collection_client,mixed_sync,999)] + [ex.submit(share_client,u) for u in mixed_shares]
            mix=[f.result() for f in fs]
          print('MIXED|collection_ok=%s|share_success=%d/3|wall=%.3f|collection_attempts=%d|share_max_attempts=%d'%(mix[0]['ok'],sum(x['ok'] for x in mix[1:]),time.time()-t0,mix[0]['attempts'],max(x['attempts'] for x in mix[1:])))
          for x in mix:
            if not x['ok'] or x['attempts']>1:print('MIXED_DETAIL|'+json.dumps(x,ensure_ascii=False,separators=(',',':')))

          # Cleanup every synthetic account made in this run.
          clean=cleanup(users,'RUN')
          print('EXPECTED_SYNTH_USERS|count=%d'%len(set(users)))
          fatal=[]
          if not html_ok:fatal.append('HTML_14656_NOT_LIVE')
          if sum(x['ok'] for x in share_retry)<4:fatal.append('SHARE_RETRY4_FAILED')
          if sum(x['ok'] for x in colsets[2])<2:fatal.append('COLLECTION_2_FAILED')
          if sum(x['ok'] for x in colsets[4])<4:fatal.append('COLLECTION_4_FAILED')
          if not mix[0]['ok'] or sum(x['ok'] for x in mix[1:])<3:fatal.append('MIXED_FAILED')
          if clean.get('ok') is not True or clean.get('remaining_records') not in (0,'0'):fatal.append('CLEANUP_FAILED')
          try:
            if int(clean.get('deleted_users') or 0)>len(set(users)):fatal.append('DUPLICATE_USER_ROWS')
          except:fatal.append('BAD_DELETED_USERS_COUNT')
          print('FINAL|fatal='+(','.join(fatal) if fatal else 'none'))
          PY
