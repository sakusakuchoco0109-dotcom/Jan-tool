name: MiteKore 3.12.35 Concurrency Test
on:
  push:
    paths:
      - '.github/workflows/mitekore-31235-concurrency-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run verified live concurrency test
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess, urllib.parse, json, re, time, random, concurrent.futures
          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          APP='https://hilarious-haupia-6e0406.netlify.app/'
          RUN=str(int(time.time()))+str(random.randint(1000,9999)); users=[]

          def curl(url, form=None, timeout=60, headers=None):
            cmd=['curl','-L','--connect-timeout','10','--max-time',str(timeout),'-sS','-w','\n__META__%{http_code}|%{time_total}|%{time_starttransfer}']
            for h in headers or []:cmd+=['-H',h]
            if form is not None:
              for k,v in form.items():cmd+=['--data-urlencode',f'{k}={v}']
            cmd+=[url]
            p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            if p.returncode:
              return 0,float(timeout),p.stdout,{'timeout':p.returncode==28,'stderr':p.stderr.strip()[:200]}
            try:
              body,meta=p.stdout.rsplit('\n__META__',1);code,total,_=meta.strip().split('|');return int(code),float(total),body,{}
            except Exception as e:return 0,0,p.stdout,{'stderr':str(e)}

          def get_json(action,params=None,timeout=60):
            q=dict(params or {});q['action']=action;q['_']=str(time.time_ns())
            code,sec,body,err=curl(GAS+'?'+urllib.parse.urlencode(q),timeout=timeout)
            if err:return code,sec,{'ok':False,'code':'TRANSPORT_TIMEOUT' if err.get('timeout') else 'TRANSPORT_ERROR','message':err.get('stderr')}
            try:return code,sec,json.loads(body)
            except:return code,sec,{'ok':False,'code':'JSON_PARSE_FAILED','message':body[:180]}

          def parse_pm(body):
            # Google may wrap HtmlService output; search broadly for our source marker and serialized payload.
            m=re.search(r'window\.parent\.postMessage\((\{.*?\}),\s*["\']\*["\']\)',body,re.S)
            if m:
              try:return json.loads(m.group(1)).get('payload') or {}
              except:pass
            return {'ok':False,'code':'POSTMESSAGE_PARSE_FAILED','message':body[:180]}

          def post_frame(action,fields,rid,timeout=70):
            form={'action':action,'requestId':rid};form.update(fields)
            code,sec,body,err=curl(GAS,form=form,timeout=timeout)
            if err:return code,sec,{'ok':False,'code':'TRANSPORT_TIMEOUT' if err.get('timeout') else 'TRANSPORT_ERROR','message':err.get('stderr')}
            return code,sec,parse_pm(body)

          def status_poll(action,rid,tries=8):
            last={}
            for i in range(tries):
              _,sec,last=get_json(action,{'requestId':rid},timeout=40)
              if last.get('status') in ('completed','error') or last.get('pending') is False:return sec,last
              time.sleep(1.2)
            return sec,last

          def is_busy(d):
            s=(str(d.get('code',''))+' '+str(d.get('message',''))).upper()
            return 'BUSY' in s or '混み合' in s or '自動再試行' in s

          # Verify versions and previous cleanup duplicate count.
          _,sec,st=get_json('status');print('VERIFY_GAS|sec=%.3f|version=%s|ok=%s'%(sec,st.get('version'),st.get('ok')))
          c,hs,html,he=curl(APP+'?ct='+RUN,timeout=30,headers=['Cache-Control: no-cache']);print('VERIFY_HTML|http=%s|sec=%.3f|marker=%s'%(c,hs,'RC1.4.641-concurrent-write' in html))
          _,_,oldclean=get_json('account_delete_status',{'requestId':'loadtest_cleanup_RUN_17884137543544'},timeout=40)
          print('PREVIOUS_CLEANUP|status=%s|deleted_users=%s|remaining=%s'%(oldclean.get('status'),oldclean.get('deleted_users'),oldclean.get('remaining_records')))
          if st.get('version')!='3.12.35':raise SystemExit(0)

          # Share preference: 4 simultaneous distinct users with the actual 4-attempt browser retry pattern.
          share_users=['loadtest_finalshare_%s_%d'%(RUN,i) for i in range(4)];users+=share_users
          def share_client(uid):
            hist=[];t0=time.time()
            for a in range(4):
              _,s,d=get_json('share_preference_set',{'userId':uid,'enabled':'1','price_enabled':'1'},timeout=40);hist.append({'sec':s,'ok':d.get('ok'),'code':d.get('code')})
              if d.get('ok') is True:return {'ok':True,'attempts':a+1,'wall':time.time()-t0,'hist':hist}
              if d.get('code') in ('TRANSPORT_TIMEOUT','JSON_PARSE_FAILED'):
                _,_,state=get_json('share_preference_get',{'userId':uid},timeout=40)
                if state.get('enabled') is True:return {'ok':True,'attempts':a+1,'wall':time.time()-t0,'hist':hist,'recovered':True}
              if not is_busy(d) and d.get('code') not in ('TRANSPORT_TIMEOUT','JSON_PARSE_FAILED'):return {'ok':False,'attempts':a+1,'wall':time.time()-t0,'hist':hist}
              if a<3:time.sleep(min(2.2,.5*(1.7**a)+.15))
            return {'ok':False,'attempts':4,'wall':time.time()-t0,'hist':hist}
          t=time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:shares=list(ex.map(share_client,share_users))
          print('SHARE4|success=%d/4|wall=%.3f|max_attempts=%d|max_client=%.3f'%(sum(x['ok'] for x in shares),time.time()-t,max(x['attempts'] for x in shares),max(x['wall'] for x in shares)))
          for x in shares:
            if x['attempts']>1 or not x['ok']:print('SHARE4_DETAIL|'+json.dumps(x,separators=(',',':')))
          time.sleep(3)

          # Collection sync: treat postMessage parse failure exactly like browser fallback and verify via status API.
          def collection_client(uid,idx):
            payload=json.dumps({'app':'fujiya_collection','userId':uid,'records':[]},separators=(',',':'));hist=[];t0=time.time()
            for a in range(1,5):
              rid='loadtest_finalcol_%s_%d_%d'%(RUN,idx,a)
              _,s,d=post_frame('collection_sync_frame',{'payload':payload},rid,timeout=55)
              if d.get('ok') is not True:
                ps,p=status_poll('collection_sync_status',rid,tries=5)
                if p: d=p
              hist.append({'attempt':a,'sec':s,'ok':d.get('ok'),'status':d.get('status'),'code':d.get('code'),'message':d.get('message')})
              if d.get('ok') is True and d.get('status') in (None,'completed'):return {'ok':True,'attempts':a,'wall':time.time()-t0,'hist':hist}
              if not is_busy(d) and d.get('code') not in ('TRANSPORT_TIMEOUT','POSTMESSAGE_PARSE_FAILED','JSON_PARSE_FAILED'):return {'ok':False,'attempts':a,'wall':time.time()-t0,'hist':hist}
              if a<4:time.sleep(1.2 if a==1 else 2.5)
            return {'ok':False,'attempts':4,'wall':time.time()-t0,'hist':hist}

          colsets={}
          for n in (2,4):
            ids=['loadtest_finalcol%d_%s_%d'%(n,RUN,i) for i in range(n)];users+=ids
            t=time.time()
            with concurrent.futures.ThreadPoolExecutor(max_workers=n) as ex:rows=list(ex.map(lambda q:collection_client(q[1],n*10+q[0]),enumerate(ids)))
            colsets[n]=rows
            print('COLLECTION%d|success=%d/%d|wall=%.3f|max_attempts=%d|max_client=%.3f'%(n,sum(x['ok'] for x in rows),n,time.time()-t,max(x['attempts'] for x in rows),max(x['wall'] for x in rows)))
            for x in rows:
              if x['attempts']>1 or not x['ok']:print('COLLECTION%d_DETAIL|%s'%(n,json.dumps(x,ensure_ascii=False,separators=(',',':'))))
            time.sleep(3)

          # Mixed: one collection sync plus three share writes.
          mixcol='loadtest_finalmixcol_'+RUN;mixshares=['loadtest_finalmixshare_%s_%d'%(RUN,i) for i in range(3)];users+=[mixcol]+mixshares
          t=time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            fs=[ex.submit(collection_client,mixcol,99)]+[ex.submit(share_client,u) for u in mixshares];mix=[f.result() for f in fs]
          print('MIXED|collection=%s|shares=%d/3|wall=%.3f|col_attempts=%d|share_max_attempts=%d'%(mix[0]['ok'],sum(x['ok'] for x in mix[1:]),time.time()-t,mix[0]['attempts'],max(x['attempts'] for x in mix[1:])))
          for x in mix:
            if x['attempts']>1 or not x['ok']:print('MIXED_DETAIL|'+json.dumps(x,ensure_ascii=False,separators=(',',':')))

          # Cleanup, verified through status regardless of HtmlService wrapper.
          rid='loadtest_finalcleanup_'+RUN
          _,cs,cd=post_frame('account_delete_frame',{'confirm':'DELETE_ACCOUNT','userIds':json.dumps(users,separators=(',',':'))},rid,timeout=180)
          ps,clean=status_poll('account_delete_status',rid,tries=8)
          print('CLEANUP|post_sec=%.3f|status=%s|ok=%s|deleted_users=%s|remaining=%s'%(cs,clean.get('status'),clean.get('ok'),clean.get('deleted_users'),clean.get('remaining_records')))
          print('EXPECTED_USERS|%d'%len(set(users)))
          print('FINAL|html_live=%s|share4=%d/4|col2=%d/2|col4=%d/4|mixed_col=%s|mixed_share=%d/3|cleanup=%s'%(
            'RC1.4.641-concurrent-write' in html,sum(x['ok'] for x in shares),sum(x['ok'] for x in colsets[2]),sum(x['ok'] for x in colsets[4]),mix[0]['ok'],sum(x['ok'] for x in mix[1:]),clean.get('status')))
          PY
