name: MiteKore Real E2E
on:
  push:
    paths:
      - '.github/workflows/mitekore-real-e2e.yml'
      - 'mitekore-e2e-test.js'
      - 'mitekore-rc543-candidate.patch'
  workflow_dispatch:
jobs:
  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare RC543 candidate
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
          curl -fsSL 'https://hilarious-haupia-6e0406.netlify.app/assets/app-core-542.js' -o app-core-542.js
          cp app-core-542.js app-core-543-candidate.js
          patch app-core-543-candidate.js < mitekore-rc543-candidate.patch
          node --check app-core-543-candidate.js
          grep -q 'RC1.4.543' app-core-543-candidate.js
      - name: Run candidate against real GAS
        run: node mitekore-e2e-test.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-rc543-real-evidence
          path: |
            01-pc-pair-qr.png
            02-phone-paired.png
            03-pc-photo-saved.png
            04-phone-after-sync.png
            pair-failure.png
            pair-failure.json
            result.json
            fatal.txt
