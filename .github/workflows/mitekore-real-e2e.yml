name: MiteKore Real E2E
on:
  push:
    paths:
      - '.github/workflows/mitekore-real-e2e.yml'
  workflow_dispatch:
jobs:
  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Run production diagnostic
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const NAME='ChatGPT同期検証0814';
            const USER='chatgpt_sync_test_0814';
            const APP='https://hilarious-haupia-6e0406.netlify.app/';
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const net=[];
            const consoleLogs=[];
            const page=await ctx.newPage();
            page.on('console',m=>consoleLogs.push(`${m.type()}: ${m.text()}`));
            page.on('pageerror',e=>consoleLogs.push('PAGEERROR: '+e.message));
            page.on('request',req=>{
              const u=req.url();
              if(/script\.google\.com|script\.googleusercontent\.com|googleapis\.com/i.test(u)){
                net.push({kind:'request',method:req.method(),url:u,postData:req.postData()||''});
              }
            });
            page.on('response',async res=>{
              const u=res.url();
              if(/script\.google\.com|script\.googleusercontent\.com|googleapis\.com/i.test(u)){
                let text=''; try{text=(await res.text()).slice(0,5000)}catch(e){text='[unreadable:'+e.message+']'}
                net.push({kind:'response',status:res.status(),url:u,text});
              }
            });
            await page.goto(APP,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(7000);
            const discovered=await page.evaluate(async({NAME,USER})=>{
              const ls={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); ls[k]=localStorage.getItem(k)}
              localStorage.setItem('fujiya_collection_user_id',USER);
              localStorage.setItem('fujiya_collection_user_name',NAME);
              localStorage.setItem('fujiya_collection_share_opt_in_v1','1');
              localStorage.setItem('fujiya_collection_share_purchase_price_opt_in_v1','1');
              localStorage.setItem('fujiya_collection_profile_v20_1',JSON.stringify({name:NAME,bio:'ChatGPT本番同期検証',favoritePlatforms:['GBA'],favoriteGames:['ポケットモンスター ファイアレッド'],links:{},visibility:{}}));
              localStorage.setItem('fujiya_collection_profile_v20_1_updated_at',new Date().toISOString());
              const fn={};
              for(const n of ['fujiyaMiteRecoSyncProfile','getGasEndpoint','submitGasPostFormNoWait','deviceSyncPush','deviceSyncPull']){
                try{fn[n]=typeof window[n]==='function'?window[n].toString().slice(0,12000):String(typeof window[n])}catch(e){fn[n]='ERR '+e.message}
              }
              const scripts=[...document.scripts].map(s=>s.src).filter(Boolean);
              const hits=[];
              for(const src of scripts){
                try{
                  const txt=await (await fetch(src,{cache:'no-store'})).text();
                  for(const needle of ['fujiyaMiteRecoSyncProfile','script.google.com/macros/s/','mite_reco_profile','profile_sync','users']){
                    const i=txt.indexOf(needle);
                    if(i>=0) hits.push({src,needle,snippet:txt.slice(Math.max(0,i-2500),Math.min(txt.length,i+7000))});
                  }
                }catch(e){hits.push({src,error:String(e)})}
              }
              return {href:location.href,title:document.title,version:document.body.innerText.match(/RC1\.4\.\d+/)?.[0]||'',scripts,fn,hits,localStorageBefore:ls};
            },{NAME,USER});
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(6000);
            let profileResult;
            try{
              profileResult=await page.evaluate(async()=>{
                if(typeof window.fujiyaMiteRecoSyncProfile!=='function') return {available:false};
                try{return {available:true,value:await window.fujiyaMiteRecoSyncProfile({force:true})};}
                catch(e){return {available:true,error:String(e&&e.stack||e)}};
              });
            }catch(e){profileResult={evalError:String(e)}}
            await page.waitForTimeout(8000);
            await page.screenshot({path:'mitekore-prod-diagnostic.png',fullPage:false});
            const after=await page.evaluate(()=>{
              const out={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(/user|profile|share|sync/i.test(k)) out[k]=localStorage.getItem(k)} return out;
            });
            const result={discovered,profileResult,network:net,console:consoleLogs,localStorageAfter:after};
            fs.writeFileSync('result.json',JSON.stringify(result,null,2));
            console.log('PROFILE_RESULT',JSON.stringify(profileResult));
            console.log('NETWORK',JSON.stringify(net,null,2));
            console.log('FUNCTIONS',JSON.stringify(discovered.fn,null,2));
            console.log('HITS',JSON.stringify(discovered.hits,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node test.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-prod-diagnostic
          path: |
            mitekore-prod-diagnostic.png
            result.json
