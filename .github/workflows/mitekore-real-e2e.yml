name: MiteKore Real E2E
on:
  push:
    paths:
      - '.github/workflows/mitekore-real-e2e.yml'
  workflow_dispatch:
jobs:
  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Run real browser test
        run: |
          cat > /tmp/test.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const NAME='ChatGPT同期検証0814';
            const USER='chatgpt_sync_test_0814';
            const APP='https://hilarious-haupia-6e0406.netlify.app/';
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            await ctx.addInitScript(({NAME,USER})=>{
              localStorage.setItem('fujiya_collection_user_id',USER);
              localStorage.setItem('fujiya_collection_user_name',NAME);
              localStorage.setItem('fujiya_collection_share_opt_in_v1','1');
              localStorage.setItem('fujiya_collection_share_purchase_price_opt_in_v1','1');
              localStorage.setItem('fujiya_collection_setup_done_v1','1');
              localStorage.setItem('fujiya_collection_tutorial_seen_v2_rc1474','1');
              localStorage.setItem('fujiya_collection_first_run_seen_v20_2_35cn','1');
              localStorage.setItem('fujiya_mitekore_early_access_v2',JSON.stringify({orderNumber:'99999999',verifiedAt:Date.now(),campaign:'test-order'}));
              localStorage.setItem('fujiya_collection_profile_v20_1',JSON.stringify({name:NAME,bio:'ChatGPT実ブラウザ同期検証',favoritePlatforms:['GBA'],favoriteGames:['ポケットモンスター ファイアレッド'],links:{},visibility:{}}));
              localStorage.setItem('fujiya_collection_profile_v20_1_updated_at',new Date().toISOString());
            },{NAME,USER});
            const page=await ctx.newPage();
            const logs=[];
            page.on('console',m=>logs.push('CONSOLE '+m.type()+': '+m.text()));
            page.on('pageerror',e=>logs.push('PAGEERROR '+e.message));
            await page.goto(APP,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(5000);
            try{await page.waitForFunction(()=>window.__FUJIYA_EARLY_ACCESS_UNLOCKED__===true,{timeout:30000});}catch(e){logs.push('unlock wait failed '+e.message)}
            for(const sel of ['[data-profile-unlock-close]','#rareBurstCloseBtn','.mike-talk-close','#tutorialCloseBtn']){
              try{const el=page.locator(sel).first(); if(await el.count()&&await el.isVisible()) await el.click({timeout:1000});}catch(e){}
            }
            // Register one real collection entry through the real UI.
            const reg=page.locator('[data-ui-tab="register"]:visible').first();
            await reg.click({timeout:10000});
            await page.waitForTimeout(800);
            const quick=page.locator('#quickRegisterModeBtn');
            if(await quick.count() && await quick.isVisible()) { await quick.click(); await page.waitForTimeout(300); }
            await page.locator('#platform').fill('GBA');
            await page.locator('#title').fill('ポケットモンスター ファイアレッド');
            await page.locator('#title').dispatchEvent('input');
            await page.waitForTimeout(1200);
            await page.locator('#saveBtn').click({timeout:10000});
            await page.waitForTimeout(4000);
            // Force real profile sync to GAS so the test name must exist in the real spreadsheet.
            const profileResult=await page.evaluate(async()=>{
              if(typeof window.fujiyaMiteRecoSyncProfile!=='function') return {available:false};
              try{return {available:true,ok:await window.fujiyaMiteRecoSyncProfile({force:true})};}
              catch(e){return {available:true,ok:false,error:String(e&&e.message||e)};}
            });
            logs.push('PROFILE_SYNC '+JSON.stringify(profileResult));
            await page.waitForTimeout(6000);
            // Capture actual app list screen.
            for(const sel of ['[data-profile-unlock-close]','#rareBurstCloseBtn','.mike-talk-close','#tutorialCloseBtn']){
              try{const el=page.locator(sel).first(); if(await el.count()&&await el.isVisible()) await el.click({timeout:1000});}catch(e){}
            }
            const list=page.locator('[data-ui-tab="list"]:visible').first();
            if(await list.count()) { await list.click(); await page.waitForTimeout(1200); }
            await page.screenshot({path:'mitekore-real-pc.png',fullPage:false});
            const state=await page.evaluate(()=>({
              version:document.body.innerText.match(/RC1\.4\.\d+/)?.[0]||'',
              userId:localStorage.getItem('fujiya_collection_user_id'),
              name:localStorage.getItem('fujiya_collection_user_name'),
              entries:(()=>{try{return JSON.parse(localStorage.getItem('fujiya_collection_v1')||'{}').entries||[]}catch(e){return []}})().map(x=>({id:x.id,title:x.title,platform:x.platform,updatedAt:x.updatedAt})),
              bodyText:document.body.innerText.slice(0,12000)
            }));
            fs.writeFileSync('result.json',JSON.stringify({profileResult,state,logs},null,2));
            console.log(JSON.stringify({profileResult,entryCount:state.entries.length,userId:state.userId,name:state.name,version:state.version,entries:state.entries.slice(0,5)},null,2));
            await browser.close();
            if(!profileResult.available || !profileResult.ok) process.exitCode=2;
            if(!state.entries.some(e=>e.title.includes('ポケットモンスター ファイアレッド'))) process.exitCode=3;
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/test.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-real-e2e-evidence
          path: |
            mitekore-real-pc.png
            result.json
