name: MiteKore Inventory Live Concurrency Benchmark V2
on:
  push:
    paths:
      - '.github/workflows/mitekore-inventory-concurrency-live-v2.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run live concurrency benchmark
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess, urllib.parse, json, time, re, html, hashlib, concurrent.futures, pathlib
          MITE='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          INV='https://script.google.com/macros/s/AKfycbxoqua0rvTXWabQSPYnJ9wvjYP8EZ0L5i-PlAwZclreciDwtmAS6dJeBXNjJrScqijm1A/exec'
          APP='20.2.35.652'; TS=str(int(time.time()*1000)); USER='github_concurrency_'+TS
          SYNC='mk_'+hashlib.sha256(('concurrency-'+TS).encode()).hexdigest()[:40]
          old=pathlib.Path('.github/workflows/mitekore-inventory-concurrency-live.yml').read_text()
          km=re.search(r"INV_WRITE_KEY='([^']+)'",old); INV_WRITE_KEY=km.group(1) if km else ''
          rows=[]
          def parse(body):
            raw=(body or '').strip()
            try:return json.loads(raw)
            except:pass
            m=re.match(r'^[A-Za-z_$][A-Za-z0-9_$.]*\((.*)\)\s*;?\s*$',raw,re.S)
            if m:
              try:return json.loads(m.group(1))
              except:pass
            for pat in [r'parent\.postMessage\((\{.*?\}),\s*["\']\*["\']\s*\)',r'window\.parent\.postMessage\((\{.*?\}),\s*["\']\*["\']\s*\)']:
              m=re.search(pat,raw,re.S)
              if m:
                try:return json.loads(m.group(1))
                except:pass
            return None
          def req(url,method='GET',fields=None,timeout=240):
            fields=dict(fields or {})
            if method=='GET':
              fields['_']=str(int(time.time()*1000)); full=url+'?'+urllib.parse.urlencode(fields)
              cmd=['curl','-L','--max-time',str(timeout),'-sS','-w','\n__M__%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}',full]
            else:
              cmd=['curl','-L','--max-time',str(timeout),'-sS','-w','\n__M__%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}']
              for k,v in fields.items():cmd+=['--data-urlencode',str(k)+'='+str(v)]
              cmd.append(url)
            p=subprocess.run(cmd,capture_output=True,text=True); out=p.stdout
            body,metric=out.rsplit('\n__M__',1) if '\n__M__' in out else (out,'ERR|0|0|0'); z=metric.strip().split('|')
            return {'http':z[0],'seconds':float(z[1] or 0),'ttfb':float(z[2] or 0),'bytes':int(float(z[3] or 0)),'body':body,'data':parse(body)}
          def summary(r):
            d=r.get('data')
            if isinstance(d,dict):return {k:d.get(k) for k in ['ok','action','version','message','code','processing','contentionAvoided','reason','status','pending','record_count','revision','performance'] if k in d}
            return {'preview':re.sub(r'\s+',' ',r.get('body',''))[:180]}
          def log(label,r,phase,delay=None):
            row={'label':label,'phase':phase,'delay':delay,'http':r['http'],'seconds':r['seconds'],'ttfb':r['ttfb'],'result':summary(r)};rows.append(row)
            print('LIVE|'+label+'|'+phase+'|'+str(delay)+'|'+r['http']+'|'+f"{r['seconds']:.3f}"+'|'+json.dumps(row['result'],ensure_ascii=False),flush=True);return r
          ms=log('mite_status',req(MITE,'GET',{'action':'status'},60),'gate'); ip=log('inv_ping',req(INV,'GET',{'action':'ping'},60),'gate')
          mv=str((ms.get('data') or {}).get('version',''));iv=str((ip.get('data') or {}).get('version',''));print('VERSIONS|'+mv+'|'+iv,flush=True)
          if mv!='3.12.32' or not iv.startswith('v2.9.12') or not INV_WRITE_KEY:
            json.dump({'aborted':True,'miteVersion':mv,'inventoryVersion':iv,'rows':rows},open('live.json','w'),ensure_ascii=False,indent=2);raise SystemExit
          lk=log('inv_lookup_starfox',req(INV,'GET',{'action':'title_lookup','title':'スターフォックス','platform':'SFC'},120),'setup'); item=(lk.get('data') or {}).get('masterItem')
          if not isinstance(item,dict) or not item.get('productMasterId'):
            print('ABORT_MASTER_NOT_FOUND',flush=True);json.dump({'aborted':True,'reason':'master_not_found','rows':rows},open('live.json','w'),ensure_ascii=False,indent=2);raise SystemExit
          def val(*ks):
            for k in ks:
              if k in item and item[k] is not None:return item[k]
            return ''
          def invup(n):
            f={'action':'product_master_upsert','requestId':f'inv_{TS}_{n}','write_request_key':f'live_{TS}_{n}','write_key':INV_WRITE_KEY,'mode':'update','product_master_id':val('productMasterId','product_master_id'),'shared_title_id':val('sharedTitleId','shared_title_id'),'platform':val('platform'),'title':val('title'),'edition_label':val('editionLabel','edition_label'),'jan':val('jan'),'model':val('model'),'maker':val('maker'),'release_date':val('releaseDate','release_date'),'genre':val('genre'),'image_url':val('imageUrl','image_url'),'image_source':val('imageSource','image_source'),'source_label':'GitHub競合実測・同値更新'}
            return req(INV,'POST',f,240)
          def title(tag):return req(MITE,'GET',{'action':'title_summary','platform':'FC','title':'スーパーマリオブラザーズ','canonicalTitle':'スーパーマリオブラザーズ'},180)
          def coll(tag):
            payload=json.dumps({'app':'fujiya_collection','version':APP,'exportedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'userId':USER,'purchasePriceShared':0,'records':[]},ensure_ascii=False,separators=(',',':'))
            return req(MITE,'POST',{'action':'collection_sync_frame','requestId':f'coll_{TS}_{tag}','appVersion':APP,'payload':payload},180)
          def devpush(tag):
            payload=json.dumps({'app':'fujiya_device_sync','version':3,'syncKey':SYNC,'expectedRevision':0,'userId':USER,'appVersion':APP,'deviceId':'bench_'+tag,'deviceName':'GitHub Concurrency','records':[]},ensure_ascii=False,separators=(',',':'))
            return req(MITE,'POST',{'action':'device_sync_push_frame','requestId':f'dev_{TS}_{tag}','appVersion':APP,'payload':payload},180)
          def devpull(tag):return req(MITE,'GET',{'action':'device_sync_pull','syncKey':SYNC,'clientVersion':'3','userId':USER,'appVersion':APP},180)
          log('baseline_title',title('base'),'baseline');log('baseline_collection',coll('base'),'baseline');log('baseline_device_push',devpush('base'),'baseline');log('baseline_device_pull',devpull('base'),'baseline')
          for n,delay in enumerate([0.15,0.60,1.20],1):
            print(f'ROUND|{n}|delay={delay}',flush=True)
            with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              fi=ex.submit(invup,n);time.sleep(delay)
              fs={'title':ex.submit(title,f'r{n}'),'collection':ex.submit(coll,f'r{n}'),'device_push':ex.submit(devpush,f'r{n}'),'device_pull':ex.submit(devpull,f'r{n}')}
              for name,f in fs.items():
                try:r=f.result(timeout=190)
                except Exception as e:r={'http':'ERR','seconds':0,'ttfb':0,'bytes':0,'body':str(e),'data':None}
                log(f'concurrent_{name}_r{n}',r,'concurrent',delay)
              try:ir=fi.result(timeout=250)
              except Exception as e:ir={'http':'ERR','seconds':0,'ttfb':0,'bytes':0,'body':str(e),'data':None}
              log(f'inventory_r{n}',ir,'inventory',delay)
            time.sleep(1)
          log('after_title',title('after'),'after');log('after_collection',coll('after'),'after');log('after_device_pull',devpull('after'),'after')
          try:req(MITE,'POST',{'action':'reset_user_collection_frame','requestId':'cleanup_'+TS,'userId':USER,'appVersion':APP},240)
          except:pass
          json.dump({'aborted':False,'miteVersion':mv,'inventoryVersion':iv,'rows':rows},open('live.json','w'),ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mitekore-inventory-concurrency-live-v2
          path: live.json
