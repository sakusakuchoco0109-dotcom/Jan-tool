name: Mitekore 14820 deploy check

on:
  push:
    paths:
      - '.github/workflows/mitekore-14820-deploy-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production HTML and GAS
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://hilarious-haupia-6e0406.netlify.app/'
          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec?action=status'

          echo '=== SITE ==='
          curl -fsSL --max-time 30 "$SITE" -o /tmp/site.html
          grep -o "14820[^'\"< ]*" /tmp/site.html | head -5 || true
          if ! grep -q "14820" /tmp/site.html; then
            echo 'ERROR: 14820 marker not found in production HTML'
            exit 11
          fi

          echo '=== GAS STATUS ==='
          curl -fsSL --max-time 45 "$GAS" -o /tmp/gas.txt
          cat /tmp/gas.txt | head -c 3000
          echo
          if ! grep -q "3.13.26" /tmp/gas.txt; then
            echo 'ERROR: GAS 3.13.26 marker not found in status response'
            exit 12
          fi

          echo 'DEPLOY_CHECK_OK'
