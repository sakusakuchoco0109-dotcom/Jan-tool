name: MiteKore GAS Full Benchmark
on:
  push:
    paths:
      - '.github/workflows/mitekore-gas-full-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Benchmark public GAS
        shell: bash
        run: |
          cat > /tmp/bench.py <<'PY'
          import subprocess, json, time, os, urllib.parse, datetime, hashlib

          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          APP='20.2.35.652'
          ts=str(int(time.time()*1000))
          uid='github_bench_'+ts
          token='github_bench_edit_'+ts+'_safe'
          results=[]
          created={'posts':[], 'review':None, 'play':None, 'article':None, 'mag_comment':None}

          def clean(s):
              return str(s or '').replace('|','/').replace('\n',' ')[:120]

          def parse_json(path):
              try:
                  with open(path,'r',encoding='utf-8') as f: return json.load(f)
              except Exception: return None

          def record(label, method, metric, path, note=''):
              try:
                  http,total,ttfb,size=metric.strip().split('|')
              except Exception:
                  http,total,ttfb,size='ERR','0','0','0'
              data=parse_json(path) if method=='GET' else None
              ok=''
              msg=note
              if isinstance(data,dict):
                  ok=str(data.get('ok',''))
                  msg=msg or data.get('message') or data.get('error') or ''
              row={'label':label,'method':method,'http':http,'seconds':float(total or 0),'ttfb':float(ttfb or 0),'bytes':int(float(size or 0)),'ok':ok,'note':clean(msg)}
              results.append(row)
              print('BENCH|{label}|{method}|{http}|{sec:.6f}|{ttfb:.6f}|{bytes}|{ok}|{note}'.format(**row), flush=True)
              return data

          def get(label, action, params=None, max_time=120):
              params=dict(params or {})
              params['action']=action
              params['_']=str(int(time.time()*1000))
              url=GAS+'?'+urllib.parse.urlencode(params)
              path='/tmp/'+''.join(c if c.isalnum() else '_' for c in label)+'.json'
              cmd=['curl','-L','--max-time',str(max_time),'-sS','-o',path,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}',url]
              try: metric=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT)
              except subprocess.CalledProcessError as e:
                  metric='ERR|0|0|0'; open(path,'w').write('{}')
              return record(label,'GET',metric,path)

          def post(label, action, fields=None, max_time=150):
              fields=dict(fields or {})
              fields['action']=action
              fields.setdefault('requestId','bench_'+label+'_'+ts+'_'+str(int(time.time()*1000)))
              fields.setdefault('appVersion',APP)
              path='/tmp/'+''.join(c if c.isalnum() else '_' for c in label)+'.html'
              cmd=['curl','-L','--max-time',str(max_time),'-sS','-o',path,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}']
              for k,v in fields.items(): cmd += ['--data-urlencode',f'{k}={v}']
              cmd.append(GAS)
              try: metric=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT)
              except subprocess.CalledProcessError:
                  metric='ERR|0|0|0'; open(path,'w').write('')
              return record(label,'POST',metric,path)

          def silent_post(action, fields=None, max_time=120):
              fields=dict(fields or {}); fields['action']=action; fields.setdefault('requestId','cleanup_'+ts+'_'+str(int(time.time()*1000))); fields.setdefault('appVersion',APP)
              cmd=['curl','-L','--max-time',str(max_time),'-sS','-o','/dev/null']
              for k,v in fields.items(): cmd += ['--data-urlencode',f'{k}={v}']
              cmd.append(GAS)
              subprocess.run(cmd,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          # ---------- read-only baseline ----------
          get('status','status')
          get('test','test')
          get('deployment_diagnostics','deployment_diagnostics')
          get('member_access','member_access',{'userId':uid,'appVersion':APP})
          get('profile_avatar_get','profile_avatar_get',{'userId':uid,'appVersion':APP})
          get('pt_balance','pt_content_reward_balance',{'userId':uid})
          get('pt_history','pt_content_reward_history',{'userId':uid,'limit':'30'})
          get('omikuji_preview','pt_omikuji_preview',{'userId':uid})
          get('omikuji_state','pt_omikuji_state',{'userId':uid})
          get('daily_topic_current','daily_topic_current',{'userId':uid})
          get('daily_topic_feed_cold','daily_topic_feed',{'limit':'80'})
          get('daily_topic_feed_warm','daily_topic_feed',{'limit':'80'})
          get('daily_feature_tags','daily_topic_feature_tags')
          get('daily_feature_search','daily_topic_feature_search',{'feature':'BGM','limit':'80','minVotes':'1'})
          get('daily_votes_title','daily_topic_votes_for_title',{'platform':'FC','title':'スーパーマリオブラザーズ','limit':'20'})
          get('mitekore_feed_cold','mitekore_feed',{'limit':'80'},180)
          get('mitekore_feed_warm','mitekore_feed',{'limit':'80'},180)
          get('mitekore_related','mitekore_related',{'platform':'FC','title':'スーパーマリオブラザーズ','limit':'12'},180)
          get('title_content_search_cold','title_content_search',{'platform':'FC','title':'スーパーマリオブラザーズ','limit':'30','offset':'0'},180)
          get('title_content_search_warm','title_content_search',{'platform':'FC','title':'スーパーマリオブラザーズ','limit':'30','offset':'0'},180)
          today=(datetime.datetime.utcnow()+datetime.timedelta(hours=9)).strftime('%Y-%m-%d')
          get('playlog_today_cold','playlog_today',{'date':today,'limit':'80'},180)
          get('playlog_today_warm','playlog_today',{'date':today,'limit':'80'},180)
          get('playlog_user_empty','playlog_user',{'userId':uid,'limit':'400'},180)
          get('playlog_recommend_empty','playlog_recommend',{'userId':uid,'limit':'12'},180)
          get('playlog_neighbors_common','playlog_neighbors',{'platform':'FC','title':'スーパーマリオブラザーズ','limit':'10'},180)
          get('title_parts_revision','title_parts_revision')
          get('title_parts_meta','title_parts_meta')
          get('title_parts_chunk','title_parts_chunk',{'offset':'0','limit':'120'},180)
          get('title_parts_snapshot_status','title_parts_snapshot_status')
          get('mitereco_ping','mitereco_ping')
          get('mitereco_catalog','mitereco_catalog',{},180)
          get('share_preference_get','share_preference_get',{'userId':uid})
          get('camera_jan_lookup','camera_jan_lookup',{'jan':'4902370504912'},180)
          get('title_master_meta','title_master_meta',{},180)
          get('title_master_chunk','title_master_chunk',{'offset':'0','limit':'500'},180)
          get('product_master_meta','product_master_meta',{},180)
          get('product_master_chunk','product_master_chunk',{'offset':'0','limit':'500'},180)
          get('magazine_list_light_cold','magazine_list_light',{'limit':'20','offset':'0','coverLimit':'4'},180)
          get('magazine_list_light_warm','magazine_list_light',{'limit':'20','offset':'0','coverLimit':'4'},180)
          get('magazine_list_full','magazine_list',{'limit':'20','offset':'0'},180)
          get('collection_sync_status','collection_sync_status',{'requestId':'bench_missing_'+ts})
          get('device_sync_status','device_sync_status',{'requestId':'bench_missing_'+ts})
          get('title_reward_health','title_reward_health',{'appVersion':APP})
          get('title_grants_get','title_grants_get',{'userId':uid,'appVersion':APP})
          get('stats_cold','stats',{},240)
          get('stats_warm','stats',{},240)
          post('stats_frame','stats_frame',{},240)

          # ---------- MiteKore post + comment ----------
          parent='mh_bench_parent_'+ts
          comment='mh_bench_comment_'+ts
          parent_json=json.dumps({'id':parent,'type':'url','text':'GitHub full benchmark parent','createdAt':datetime.datetime.utcnow().isoformat()+'Z','updatedAt':datetime.datetime.utcnow().isoformat()+'Z','author':{'userId':uid,'userName':'GitHub Benchmark','nickname':'','avatar':''},'attachment':{'url':'https://example.com/','commentsEnabled':True},'shared':False,'source':'github_full_bench'},ensure_ascii=False,separators=(',',':'))
          post('mitekore_post_save','mitekore_post_save_frame',{'postJson':parent_json,'editToken':token},180)
          created['posts'].append(parent)
          comment_json=json.dumps({'id':comment,'type':'comment','text':'benchmark comment','createdAt':datetime.datetime.utcnow().isoformat()+'Z','updatedAt':datetime.datetime.utcnow().isoformat()+'Z','author':{'userId':uid,'userName':'GitHub Benchmark','nickname':'','avatar':''},'attachment':{'comment':{'parentId':parent,'parentAuthorName':'GitHub Benchmark'}},'shared':False,'source':'github_full_bench'},ensure_ascii=False,separators=(',',':'))
          post('mitekore_comment_save','mitekore_post_save_frame',{'postJson':comment_json,'editToken':token},180)
          created['posts'].append(comment)
          get('mitekore_comments_after_write','mitekore_comments',{'parentId':parent,'limit':'200'},180)
          get('mitekore_feed_after_write','mitekore_feed',{'limit':'80'},240)
          post('mitekore_comment_delete','mitekore_post_delete_frame',{'postId':comment,'userId':uid,'editToken':token},180)
          post('mitekore_post_delete','mitekore_post_delete_frame',{'postId':parent,'userId':uid,'editToken':token},180)
          created['posts']=[]

          # ---------- Game review ----------
          review='RVbench_'+ts
          sid='BENCH-SID-'+ts
          post('review_save','game_review_save_frame',{'reviewId':review,'userId':uid,'userName':'GitHub Benchmark','sharedTitleId':sid,'platform':'FC','title':'BENCH TEST GAME','rating':'4','text':'temporary benchmark review','spoiler':'0','source':'benchmark','toTopic':'0'},180)
          created['review']=review
          get('review_list_after_write','game_review_list',{'sharedTitleId':sid,'platform':'FC','title':'BENCH TEST GAME','limit':'100'},180)
          post('review_delete','game_review_delete_frame',{'reviewId':review,'userId':uid},180)
          created['review']=None

          # ---------- Play log ----------
          play_title='BENCH TEST GAME '+ts
          post('playlog_session_save','playlog_session_save_frame',{'userId':uid,'userName':'GitHub Benchmark','nickname':'','platform':'TEST','title':play_title,'playedDate':today,'source':'benchmark','note':'benchmark play','privateNote':'','clearFlag':'false','playTimeMinutes':'5','score':'123','scoreUnit':'点','clearTimeSeconds':'0','shareToTopic':'false','editToken':token},240)
          d=get('playlog_user_after_write','playlog_user',{'userId':uid,'limit':'400'},180)
          play_id=''
          if isinstance(d,dict):
              for row in d.get('logs',[]):
                  if str(row.get('title',''))==play_title: play_id=str(row.get('playId') or row.get('play_id') or '')
          if play_id:
              created['play']=play_id
          get('playlog_today_after_write','playlog_today',{'date':today,'limit':'80'},180)
          get('playlog_recommend_after_write','playlog_recommend',{'userId':uid,'limit':'12'},180)
          get('playlog_neighbors_after_write','playlog_neighbors',{'platform':'TEST','title':play_title,'limit':'10'},180)
          if play_id:
              post('playlog_delete','playlog_delete_frame',{'userId':uid,'playId':play_id},180)
              created['play']=None

          # ---------- Magazine article + comment + vote ----------
          article='mag_bench_'+ts
          mag_comment='mh_mag_comment_'+ts
          article_obj={'id':article,'authorUserId':uid,'authorName':'GitHub Benchmark','authorNickname':'','authorAvatar':'','title':'速度計測記事','category':'その他','tags':['benchmark'],'body':'GitHub ActionsからGASの速度を測るための一時的なテスト記事です。計測後に自動削除します。','bodyBlocks':None,'coverData':'','relatedGames':[],'poll':{'enabled':True,'question':'速度計測アンケート','options':[{'id':'opt_1','text':'A'},{'id':'opt_2','text':'B'}]},'media':None,'version':1,'commentsEnabled':True}
          mag_payload=json.dumps({'app':'fujiya_mitemaga','version':5,'article':article_obj},ensure_ascii=False,separators=(',',':'))
          post('magazine_save','magazine_save_frame',{'payload':mag_payload},240)
          created['article']=article
          get('magazine_read_after_write','magazine_read',{'articleId':article,'userId':uid},180)
          get('magazine_list_light_after_write','magazine_list_light',{'limit':'20','offset':'0','coverLimit':'4'},180)
          post('magazine_comment_save','magazine_comment_save_frame',{'articleId':article,'commentId':mag_comment,'userId':uid,'userName':'GitHub Benchmark','nickname':'','avatar':'','text':'temporary magazine benchmark comment','createdAt':datetime.datetime.utcnow().isoformat()+'Z','editToken':token},180)
          created['mag_comment']=mag_comment
          get('magazine_comments_after_write','magazine_comments',{'articleId':article,'limit':'100'},180)
          post('magazine_vote','magazine_vote_frame',{'articleId':article,'userId':uid,'optionId':'opt_1'},180)
          post('magazine_comment_delete','magazine_comment_delete_frame',{'commentId':mag_comment,'userId':uid,'editToken':token},180)
          created['mag_comment']=None
          post('magazine_delete','magazine_delete_frame',{'articleId':article,'userId':uid},240)
          created['article']=None

          # ---------- final summary ----------
          results_sorted=sorted(results,key=lambda r:r['seconds'],reverse=True)
          print('=== BENCHMARK_RANKING_JSON ===')
          print(json.dumps(results_sorted,ensure_ascii=False,separators=(',',':')))
          with open('gas-full-benchmark.json','w',encoding='utf-8') as f: json.dump({'generatedAt':datetime.datetime.utcnow().isoformat()+'Z','results':results,'ranking':results_sorted},f,ensure_ascii=False,indent=2)

          # cleanup safety net
          for pid in reversed(created['posts']): silent_post('mitekore_post_delete_frame',{'postId':pid,'userId':uid,'editToken':token})
          if created['review']: silent_post('game_review_delete_frame',{'reviewId':created['review'],'userId':uid})
          if created['play']: silent_post('playlog_delete_frame',{'userId':uid,'playId':created['play']})
          if created['mag_comment']: silent_post('magazine_comment_delete_frame',{'commentId':created['mag_comment'],'userId':uid,'editToken':token})
          if created['article']: silent_post('magazine_delete_frame',{'articleId':created['article'],'userId':uid})
          PY
          python3 /tmp/bench.py
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-gas-full-benchmark
          path: gas-full-benchmark.json
