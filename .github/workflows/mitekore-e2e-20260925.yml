name: Mitekore E2E 20260925
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run mitekore smoke
        run: node e2e/mitekore-smoke-20260925.js
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-e2e-20260925
          path: artifacts/
          if-no-files-found: warn
