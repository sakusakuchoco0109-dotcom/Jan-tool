name: MiteKore Shared Like Display Fix Proof
on:
  push:
    paths:
      - '.github/workflows/mitekore-like-display-fix-proof.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Patch current live HTML in memory and verify shared count survives old renderer
        run: |
          curl -fsSL 'https://hilarious-haupia-6e0406.netlify.app/' -o live.html
          node <<'NODE'
          const fs=require('fs');
          const s0=fs.readFileSync('live.html','utf8');
          let s=s0;
          const a1="const likeCache=new Map();";
          if(!s.includes(a1)) throw new Error('likeCache anchor missing');
          s=s.replace(a1,a1+"window.fujiyaAuthoritativeLikeState14709=postKey=>likeCache.get(String(postKey||''))||null;");
          const a2="const liked=isLiked(postId);const likeCount=cardBaseLikes(card)+localLikeCount(postId);const own=cardAuthorId(card)&&cardAuthorId(card)===currentUser();";
          if(!s.includes(a2)) throw new Error('mh renderer anchor missing');
          s=s.replace(a2,"const own=!!cardAuthorId(card)&&cardAuthorId(card)===currentUser();const server=window.fujiyaAuthoritativeLikeState14709?.(String(postId||''));const liked=server?!!server.liked:isLiked(postId);const likeCount=server?Math.max(0,Number(server.count||0)||0):(cardBaseLikes(card)+localLikeCount(postId));");
          const a3="const key=String(b?.dataset?.fujiyaCrossLike||''),author=String(b?.dataset?.fujiyaCrossAuthor||''),source=String(b?.dataset?.fujiyaCrossSource||''),is=liked(key),n=count(key),own=!!author&&author===currentUser();";
          if(!s.includes(a3)) throw new Error('cross renderer anchor missing');
          s=s.replace(a3,"const key=String(b?.dataset?.fujiyaCrossLike||''),author=String(b?.dataset?.fujiyaCrossAuthor||''),source=String(b?.dataset?.fujiyaCrossSource||''),own=!!author&&author===currentUser(),server=window.fujiyaAuthoritativeLikeState14709?.(key),is=server?!!server.liked:liked(key),n=server?Math.max(0,Number(server.count||0)||0):count(key);");
          fs.writeFileSync('patched-live.html',s);
          console.log('patched bytes',s.length,'delta',s.length-s0.length);
          NODE
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const APP='https://hilarious-haupia-6e0406.netlify.app/';
          const USER='fujiya_chatgpt_like_33957573620_1';
          const KEY='article:mag_ai_aiq_20260901_0012_012';
          const html=fs.readFileSync('patched-live.html','utf8');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function dismiss(page){for(const sel of ['[data-profile-unlock-close]','#rareBurstCloseBtn','.mike-talk-close','#tutorialCloseBtn','#firstRunCloseBtn','#devicePairCloseBtn']){try{const x=page.locator(sel).first();if(await x.count()&&await x.isVisible())await x.click({force:true,timeout:800});}catch(_){}}}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            await ctx.addInitScript(({USER,KEY})=>{
              localStorage.setItem('fujiya_collection_user_id',USER);
              localStorage.setItem('fujiya_mitereco_identity_user_v2',USER);
              localStorage.setItem('fujiya_collection_user_name','チャッピー動作確認');
              localStorage.setItem('fujiya_collection_profile_v20_1',JSON.stringify({name:'チャッピー動作確認',favoritePlatforms:[],favoriteGames:[],links:{},visibility:{}}));
              localStorage.setItem('fujiya_collection_setup_done_v1','1');
              localStorage.setItem('fujiya_collection_tutorial_seen_v2_rc1474','1');
              localStorage.setItem('fujiya_collection_first_run_seen_v20_2_35cn','1');
              localStorage.setItem('fujiya_collection_share_opt_in_v1','1');
              localStorage.setItem('fujiya_mitehoshii_like_local_v1',JSON.stringify({[USER]:{[KEY]:{likedAt:new Date().toISOString(),giverPt:1,authorId:'mitekore_ai_editorial',source:'article'}}}));
            },{USER,KEY});
            const page=await ctx.newPage();
            await page.route(APP,route=>route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html}));
            await page.goto(APP,{waitUntil:'domcontentloaded',timeout:60000});await sleep(7000);await dismiss(page);
            await page.locator('[data-ui-tab="magazine"]:visible').first().click({force:true});await sleep(1500);await dismiss(page);
            await page.locator('[data-mag-view="articles"]:visible').first().click({force:true});
            await page.waitForFunction(()=>[...document.querySelectorAll('.mitemaga-card')].some(x=>x.textContent.includes('トラキア776')),{timeout:70000});
            const card=page.locator('.mitemaga-card').filter({hasText:'トラキア776'}).first();
            const like=card.locator('.fujiya-cross-like').first();
            await like.waitFor({state:'visible',timeout:20000});
            await page.waitForFunction(key=>window.fujiyaAuthoritativeLikeState14709?.(key)?.count>=1,KEY,{timeout:30000});
            const before=await like.locator('.fujiya-cross-like-count').textContent();
            const cache=await page.evaluate(key=>window.fujiyaAuthoritativeLikeState14709?.(key)||null,KEY);
            await card.evaluate(el=>{const d=document.createElement('i');el.appendChild(d);d.remove();});
            await sleep(800);
            const after=await like.locator('.fujiya-cross-like-count').textContent();
            const out={before,after,cache,local:await page.evaluate(()=>JSON.parse(localStorage.getItem('fujiya_mitehoshii_like_local_v1')||'{}'))};
            console.log('DISPLAY_PROOF',JSON.stringify(out));
            fs.writeFileSync('display-proof.json',JSON.stringify(out,null,2));
            await page.screenshot({path:'display-proof.png',fullPage:false});
            if(String(before)!==String(cache.count)||String(after)!==String(cache.count))throw new Error('shared count overwritten '+JSON.stringify(out));
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-shared-like-display-fix-proof
          path: |
            display-proof.json
            display-proof.png
