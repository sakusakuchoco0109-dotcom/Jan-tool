name: MiteKore GAS Remaining Benchmark
on:
  push:
    paths:
      - '.github/workflows/mitekore-gas-remaining-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Benchmark remaining MiteKore GAS routes
        shell: bash
        run: |
          cat > /tmp/bench.py <<'PY'
          import subprocess, json, time, urllib.parse, datetime, hashlib, re, html, os

          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          APP='20.2.35.652'
          ts=str(int(time.time()*1000))
          uid='github_remaining_'+ts
          alias='github_remaining_alias_'+ts
          author='github_remaining_author_'+ts
          sync_key='mk_'+hashlib.sha256(('remaining-'+ts).encode()).hexdigest()[:40]
          today=(datetime.datetime.utcnow()+datetime.timedelta(hours=9)).strftime('%Y-%m-%d')
          month=(datetime.datetime.utcnow()+datetime.timedelta(hours=9)).strftime('%Y-%m')
          rows=[]
          cleanup=[]

          def safe_name(v): return re.sub(r'[^A-Za-z0-9_-]+','_',v)[:100]
          def parse_body(path):
              try: body=open(path,'r',encoding='utf-8',errors='ignore').read()
              except: return None,''
              raw=body.strip()
              try: return json.loads(raw), body
              except: pass
              m=re.match(r'^[A-Za-z_$][A-Za-z0-9_$.]*\((.*)\)\s*;?\s*$',raw,re.S)
              if m:
                  try: return json.loads(m.group(1)), body
                  except: pass
              m=re.search(r'<pre[^>]*>(.*?)</pre>',body,re.S|re.I)
              if m:
                  text=html.unescape(m.group(1)).strip()
                  try: return json.loads(text), body
                  except: pass
              m=re.search(r'window\.parent\.postMessage\((\{.*\}),\s*[\"\']\*[\"\']\s*\)',body,re.S)
              if m:
                  try: return json.loads(m.group(1)), body
                  except: pass
              return None,body

          def record(label, action, method, metric, path, path_type, note=''):
              try: http,total,ttfb,size=metric.strip().split('|')
              except: http,total,ttfb,size='ERR','0','0','0'
              data,body=parse_body(path)
              ok=''
              msg=note
              result_action=''
              if isinstance(data,dict):
                  ok=data.get('ok','')
                  result_action=str(data.get('action',''))
                  msg=msg or str(data.get('message') or data.get('error') or '')
              row={
                'label':label,'action':action,'method':method,'pathType':path_type,
                'http':http,'seconds':float(total or 0),'ttfb':float(ttfb or 0),
                'bytes':int(float(size or 0)),'ok':ok,'resultAction':result_action,
                'message':str(msg)[:220], 'bodyPreview':re.sub(r'\s+',' ',body)[:300]
              }
              rows.append(row)
              print('BENCH|{label}|{action}|{method}|{pathType}|{http}|{seconds:.3f}|{ttfb:.3f}|{ok}|{message}'.format(**row),flush=True)
              return data

          def get(label,action,params=None,path_type='read_only',timeout=180):
              q=dict(params or {}); q['action']=action; q['_']=str(int(time.time()*1000))
              path='/tmp/'+safe_name(label)+'.out'
              url=GAS+'?'+urllib.parse.urlencode(q)
              cmd=['curl','-L','--max-time',str(timeout),'-sS','-o',path,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}',url]
              try: metric=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT).strip()
              except subprocess.CalledProcessError as e:
                  metric='ERR|0|0|0'; open(path,'w').write(str(e.output or ''))
              return record(label,action,'GET',metric,path,path_type)

          def post(label,action,fields=None,path_type='write',timeout=240):
              f=dict(fields or {}); f['action']=action
              f.setdefault('requestId','rem_'+safe_name(label)+'_'+ts+'_'+str(int(time.time()*1000)))
              f.setdefault('appVersion',APP)
              path='/tmp/'+safe_name(label)+'.out'
              cmd=['curl','-L','--max-time',str(timeout),'-sS','-o',path,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}']
              for k,v in f.items(): cmd += ['--data-urlencode',str(k)+'='+str(v)]
              cmd.append(GAS)
              try: metric=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT).strip()
              except subprocess.CalledProcessError as e:
                  metric='ERR|0|0|0'; open(path,'w').write(str(e.output or ''))
              return record(label,action,'POST',metric,path,path_type)

          def silent_post(action,fields=None,timeout=240):
              f=dict(fields or {});f['action']=action;f.setdefault('requestId','cleanup_'+ts+'_'+str(int(time.time()*1000)));f.setdefault('appVersion',APP)
              cmd=['curl','-L','--max-time',str(timeout),'-sS','-o','/dev/null']
              for k,v in f.items(): cmd+=['--data-urlencode',str(k)+'='+str(v)]
              cmd.append(GAS); subprocess.run(cmd,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          get('account_delete_status_missing','account_delete_status',{'requestId':'missing_'+ts})
          get('buyback_mail_status_missing','buyback_mail_status',{'submissionId':'missing_'+ts})
          post('buyback_mail_test_frame','buyback_mail_test_frame',{},'safe_no_send')
          get('daily_topic_results_current','daily_topic_results',{},'read_only',180)
          get('device_sync_probe','device_sync_probe',{},'unsupported_candidate',60)
          get('device_sync_pull_empty','device_sync_pull',{'syncKey':sync_key,'clientVersion':'3','userId':uid,'appVersion':APP},'read_only',180)
          get('pt_coupon_user_state_empty','pt_coupon_user_state',{'userId':uid},'read_only',180)
          get('reset_user_collection_status_missing','reset_user_collection_status',{'requestId':'missing_'+ts},'read_only',120)
          get('title_description_catalog','title_description_catalog',{},'read_only',240)
          get('title_description_requests','title_description_requests',{},'read_only',240)
          get('title_descriptions_import_status_missing','title_descriptions_import_status',{'requestId':'missing_'+ts},'read_only',120)
          get('title_descriptions_verify_empty','title_descriptions_verify',{'ids':'','checks':''},'read_only',240)
          get('title_master_delta','title_master_delta',{'since_revision':'1','cursor':'0','limit':'200'},'read_only',240)
          get('title_reward_action_status_missing','title_reward_action_status',{'requestId':'missing_'+ts},'read_only',120)
          get('title_summary_mario','title_summary',{'platform':'FC','title':'スーパーマリオブラザーズ','canonicalTitle':'スーパーマリオブラザーズ'},'read_only',240)
          post('title_summary_frame_mario','title_summary_frame',{'platform':'FC','title':'スーパーマリオブラザーズ','canonicalTitle':'スーパーマリオブラザーズ'},'unsupported_candidate',120)
          get('user_alias_status_missing','user_alias_status',{'requestId':'missing_'+ts},'read_only',120)
          get('youtube_videos','youtube_videos',{'mode':'general','title':'スーパーマリオブラザーズ','q':'スーパーマリオブラザーズ FC','max':'5'},'read_only_external',180)

          get('magazine_link_preview','magazine_link_preview',{'url':'https://example.com/','userId':uid},'read_only_external',180)
          get('magazine_youtube_preview','magazine_youtube_preview',{'url':'https://www.youtube.com/watch?v=dQw4w9WgXcQ'},'read_only_external',180)
          rss='https://hnrss.org/frontpage'
          get('magazine_rss_preview','magazine_rss_preview',{'feedUrl':rss,'limit':'3','force':'1'},'read_only_external',180)
          feed=get('magazine_rss_feed','magazine_rss_feed',{'feedUrl':rss,'limit':'5','force':'1'},'read_only_external',180)
          item_url=''
          if isinstance(feed,dict):
              items=feed.get('items') or []
              if items and isinstance(items[0],dict): item_url=str(items[0].get('url') or '')
          get('magazine_rss_item','magazine_rss_item',{'feedUrl':rss,'itemUrl':item_url or 'https://example.com/not-in-feed','force':'1'},'read_only_external',180)

          article='mag_remaining_'+ts
          article_obj={'id':article,'authorUserId':uid,'authorName':'GitHub Benchmark','authorNickname':'','authorAvatar':'','title':'速度計測用一時記事','category':'その他','tags':['benchmark'],'body':'速度計測のための一時記事。自動削除します。','bodyBlocks':None,'coverData':'','relatedGames':[],'poll':{'enabled':False,'question':'','options':[]},'media':None,'version':1,'commentsEnabled':True}
          mag_payload=json.dumps({'app':'fujiya_mitemaga','version':5,'article':article_obj},ensure_ascii=False,separators=(',',':'))
          post('support_magazine_save','magazine_save_frame',{'payload':mag_payload},'support_setup',240)
          cleanup.append(('magazine_delete_frame',{'articleId':article,'userId':uid}))
          get('magazine_card_media','magazine_card_media',{'articleId':article},'read_only_synthetic',180)
          post('magazine_read_frame','magazine_read_frame',{'articleId':article,'userId':uid},'read_only_frame_synthetic',180)
          post('magazine_comments_frame','magazine_comments_frame',{'articleId':article,'limit':'100'},'read_only_frame_synthetic',180)
          post('magazine_list_light_frame','magazine_list_light_frame',{'limit':'20','offset':'0','coverLimit':'4'},'read_only_frame',240)
          post('magazine_list_frame','magazine_list_frame',{'limit':'20','offset':'0'},'read_only_frame',300)
          post('support_magazine_delete','magazine_delete_frame',{'articleId':article,'userId':uid},'support_cleanup',240)
          cleanup=[x for x in cleanup if not (x[0]=='magazine_delete_frame' and x[1].get('articleId')==article)]

          parent='mh_remaining_'+ts
          edit='edit_remaining_'+ts
          now=datetime.datetime.utcnow().isoformat()+'Z'
          parent_json=json.dumps({'id':parent,'type':'url','text':'GitHub remaining benchmark - auto delete','createdAt':now,'updatedAt':now,'author':{'userId':uid,'userName':'GitHub Benchmark','nickname':'','avatar':''},'attachment':{'url':'https://example.com/','commentsEnabled':True},'shared':False,'source':'github_remaining_bench'},ensure_ascii=False,separators=(',',':'))
          post('support_mitekore_parent_save','mitekore_post_save_frame',{'postJson':parent_json,'editToken':edit},'support_setup',240)
          cleanup.append(('mitekore_post_delete_frame',{'postId':parent,'userId':uid,'editToken':edit}))
          post('mitekore_comments_frame','mitekore_comments_frame',{'parentId':parent,'limit':'200'},'read_only_frame_synthetic',180)
          post('support_mitekore_parent_delete','mitekore_post_delete_frame',{'postId':parent,'userId':uid,'editToken':edit},'support_cleanup',240)
          cleanup=[x for x in cleanup if not (x[0]=='mitekore_post_delete_frame' and x[1].get('postId')==parent)]

          collection_payload=json.dumps({'app':'fujiya_collection','version':APP,'exportedAt':now,'userId':uid,'purchasePriceShared':0,'records':[]},ensure_ascii=False,separators=(',',':'))
          post('collection_sync_frame_empty','collection_sync_frame',{'payload':collection_payload},'full_write_synthetic',300)

          device_payload=json.dumps({'app':'fujiya_device_sync','version':3,'syncKey':sync_key,'expectedRevision':0,'userId':uid,'appVersion':APP,'deviceId':'bench_device_'+ts,'deviceName':'GitHub Benchmark','records':[]},ensure_ascii=False,separators=(',',':'))
          post('device_sync_push_frame_empty','device_sync_push_frame',{'payload':device_payload},'full_write_synthetic',300)
          get('device_sync_pull_after_push','device_sync_pull',{'syncKey':sync_key,'clientVersion':'3','userId':uid,'appVersion':APP},'read_only_after_write',180)

          post('share_preference_set','share_preference_set',{'userId':uid,'enabled':'1','purchasePriceShared':'0'},'full_write_synthetic',180)
          post('stores_email_save_frame','stores_email_save_frame',{'userId':uid,'email':'benchmark+'+ts+'@example.com'},'full_write_synthetic',180)
          post('stores_email_clear_frame','stores_email_clear_frame',{'userId':uid},'cleanup_write_synthetic',180)

          alias_req='alias_'+ts
          post('user_alias_register_frame','user_alias_register_frame',{'requestId':alias_req,'canonicalUserId':uid,'aliases':json.dumps([alias],ensure_ascii=False),'source':'github_remaining_benchmark'},'full_write_synthetic',300)
          get('user_alias_status_after_register','user_alias_status',{'requestId':alias_req},'read_only_after_write',120)

          play_title='BENCH REMAINING '+ts
          mark=post('playlog_mark_frame','playlog_mark_frame',{'userId':uid,'userName':'GitHub Benchmark','nickname':'','sharedTitleId':'','platform':'TEST','title':play_title,'playedDate':today,'source':'github_remaining'},'full_write_synthetic',240)
          play_id='';play_key=''
          if isinstance(mark,dict) and isinstance(mark.get('play'),dict):
              play_id=str(mark['play'].get('playId') or ''); play_key=str(mark['play'].get('playKey') or '')
          media_fields={'userId':uid,'playId':play_id,'playKey':play_key,'removeImage':'true','removePrivateImage':'true'}
          post('playlog_media_save_frame_remove','playlog_media_save_frame',media_fields,'full_write_synthetic_no_upload',240)
          post('support_playlog_delete','playlog_delete_frame',{'userId':uid,'playId':play_id,'playKey':play_key,'platform':'TEST','title':play_title,'playedDate':today},'support_cleanup',240)

          reset_req='reset_'+ts
          post('reset_user_collection_frame','reset_user_collection_frame',{'requestId':reset_req,'userId':uid},'full_write_synthetic',300)
          get('reset_user_collection_status_after','reset_user_collection_status',{'requestId':reset_req},'read_only_after_write',120)

          post('content_referral_save_frame_validation','content_referral_save_frame',{'buyerUserId':uid,'sharedTitleId':'','sourceType':'review','sourceId':'','sourceAuthorUserId':author},'expected_rejection_no_persistent_write',180)
          post('content_referral_clear_frame_empty','content_referral_clear_frame',{'buyerUserId':uid,'sharedTitleId':''},'safe_noop',180)
          post('daily_topic_answer_frame_validation','daily_topic_answer_frame',{'topicId':'invalid_'+ts,'userId':uid,'userName':'GitHub Benchmark','platform':'TEST','title':'BENCH','sharedTitleId':''},'expected_rejection_no_public_post',180)
          post('profile_avatar_save_frame_entitlement','profile_avatar_save_frame',{'userId':uid,'imageData':'data:image/png;base64,iVBORw0KGgo='},'expected_rejection_no_entitlement',180)
          post('pt_coupon_request_frame_validation','pt_coupon_request_frame',{'requestIdValue':'coupon_'+ts,'userId':uid,'month':month,'clientAvailablePt':'0'},'expected_rejection_no_coupon_row',180)
          post('pt_coupon_cancel_frame_missing','pt_coupon_cancel_frame',{'requestIdValue':'coupon_missing_'+ts,'userId':uid},'expected_rejection_no_write',180)
          post('pt_omikuji_draw_frame_validation','pt_omikuji_draw_frame',{'userId':uid,'clientAvailablePt':'0'},'expected_rejection_no_pt_spend',180)
          post('title_reward_claim_frame_invalid','title_reward_claim_frame',{'userId':uid,'code':'GITHUB-NOT-A-REAL-CODE-'+ts},'expected_rejection_no_grant',180)
          get('title_description_request_validation','title_description_request',{'userId':uid,'platform':'','title':'','sharedTitleId':''},'expected_rejection_no_request',180)
          post('title_descriptions_import_frame_auth','title_descriptions_import_frame',{'adminToken':'','csvText':'id,title\nTEST,TEST'},'expected_rejection_no_admin_write',180)
          post('buyback_mail_validation','buyback_mail',{},'expected_rejection_no_email',180)
          post('buyback_mail_frame_validation','buyback_mail_frame',{},'expected_rejection_no_email',180)
          get('store_qr_batch_get_missing','store_qr_batch_get',{'token':'bench_missing_'+ts},'expected_lookup_miss',180)
          get('store_qr_batch_get_frame_missing','store_qr_batch_get_frame',{'token':'bench_missing_'+ts,'requestId':'qr_'+ts},'expected_lookup_miss_frame',180)

          account_req='acct_'+ts
          post('account_delete_frame_synthetic','account_delete_frame',{'requestId':account_req,'userId':uid,'userIds':json.dumps([uid,alias,author]),'miteRecoToken':'','syncKey':sync_key,'confirm':'DELETE_ACCOUNT'},'full_write_synthetic_cleanup',420)
          get('account_delete_status_after','account_delete_status',{'requestId':account_req},'read_only_after_write',120)

          for action,fields in reversed(cleanup):
              try: silent_post(action,fields,240)
              except: pass

          ranking=sorted(rows,key=lambda r:r['seconds'],reverse=True)
          target_actions=sorted(set(r['action'] for r in rows if not r['label'].startswith('support_')))
          out={'generatedAt':datetime.datetime.utcnow().isoformat()+'Z','endpoint':GAS,'syntheticUser':uid,'targetActionCount':len(target_actions),'targetActions':target_actions,'results':rows,'ranking':ranking}
          with open('mitekore-gas-remaining-benchmark.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print('TARGET_ACTION_COUNT',len(target_actions),flush=True)
          print('TOP10',json.dumps(ranking[:10],ensure_ascii=False),flush=True)
          PY
          python3 /tmp/bench.py
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-gas-remaining-benchmark
          path: mitekore-gas-remaining-benchmark.json
