name: MiteKore Current Critical Audit 0905
on:
  push:
    paths:
      - 'mitekore-current-critical-audit-0905.js'
      - '.github/workflows/mitekore-current-critical-audit-0905.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare browser
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
          node --check mitekore-current-critical-audit-0905.js
      - name: Run critical audit
        run: node mitekore-current-critical-audit-0905.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-current-critical-audit-0905
          path: current-critical-audit-result.json
