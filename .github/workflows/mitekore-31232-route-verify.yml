name: MiteKore 3.12.32 Route Verify
on:
  push:
    paths:
      - '.github/workflows/mitekore-31232-route-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify routes
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess,urllib.parse,time,json,re
          G='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec';ts=str(int(time.time()*1000));rows=[]
          def c(method,fields,timeout=120):
            if method=='GET':
              f=dict(fields);f['_']=str(int(time.time()*1000));cmd=['curl','-L','--max-time',str(timeout),'-sS','-w','\nM%{http_code}|%{time_total}',G+'?'+urllib.parse.urlencode(f)]
            else:
              cmd=['curl','-L','--max-time',str(timeout),'-sS','-w','\nM%{http_code}|%{time_total}']
              for k,v in fields.items():cmd+=['--data-urlencode',str(k)+'='+str(v)]
              cmd.append(G)
            p=subprocess.run(cmd,capture_output=True,text=True);body,met=p.stdout.rsplit('\nM',1) if '\nM' in p.stdout else (p.stdout,'ERR|0');z=met.split('|');
            data=None
            try:data=json.loads(body.strip())
            except:pass
            return {'http':z[0],'seconds':float(z[1]),'data':data,'preview':re.sub(r'\s+',' ',body)[:220]}
          def log(name,r):rows.append({'name':name,**r});print('VERIFY|'+name+'|'+r['http']+'|'+f"{r['seconds']:.3f}"+'|'+json.dumps(r['data'],ensure_ascii=False)[:500] if r['data'] else 'VERIFY|'+name+'|'+r['http']+'|'+f"{r['seconds']:.3f}"+'|'+r['preview'],flush=True)
          for i in range(3):
            rid='tsf_'+ts+'_'+str(i);log('title_summary_frame_'+str(i+1),c('POST',{'action':'title_summary_frame','requestId':rid,'platform':'FC','title':'スーパーマリオブラザーズ','canonicalTitle':'スーパーマリオブラザーズ'},120));time.sleep(.5)
          for i in range(5):log('collection_status_missing_'+str(i+1),c('GET',{'action':'collection_sync_status','requestId':'missing_'+ts+'_'+str(i)},90));time.sleep(.5)
          for i in range(3):log('device_status_missing_'+str(i+1),c('GET',{'action':'device_sync_status','requestId':'missing_'+ts+'_'+str(i)},90));time.sleep(.5)
          json.dump(rows,open('verify.json','w'),ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mitekore-31232-route-verify
          path: verify.json
