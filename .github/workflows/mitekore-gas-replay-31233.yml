name: MiteKore 3.12.33 Final Slow-Path Recheck
on:
  push:
    paths:
      - '.github/workflows/mitekore-gas-replay-31233.yml'
  workflow_dispatch:

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recheck actual slow paths
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess, urllib.parse, json, time, statistics, re, hashlib
          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          APP='RC1.4.640-stall-resilience'
          TS=str(int(time.time()*1000)); rows=[]
          def call(label,action,params=None,method='GET',timeout=420):
              params=dict(params or {}); params['action']=action; params['_']=str(time.time_ns())
              out='/tmp/'+re.sub(r'[^A-Za-z0-9_-]','_',label)+'.out'
              if method=='GET':
                  url=GAS+'?'+urllib.parse.urlencode(params)
                  cmd=['curl','-L','--max-time',str(timeout),'-sS','-o',out,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}',url]
              else:
                  params.setdefault('requestId','final_'+label+'_'+TS)
                  params.setdefault('appVersion',APP)
                  cmd=['curl','-L','--max-time',str(timeout),'-sS','-o',out,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}']
                  for k,v in params.items():cmd+=['--data-urlencode',str(k)+'='+str(v)]
                  cmd.append(GAS)
              try:m=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT).strip()
              except subprocess.CalledProcessError as e:m='ERR|0|0|0'
              p=m.split('|');sec=float(p[1] or 0) if len(p)>1 else 0
              try:body=open(out,encoding='utf-8',errors='ignore').read()
              except:body=''
              row={'label':label,'action':action,'method':method,'http':p[0] if p else 'ERR','seconds':sec,'ttfb':float(p[2] or 0) if len(p)>2 else 0,'bytes':int(float(p[3] or 0)) if len(p)>3 else 0,'preview':re.sub(r'\s+',' ',body)[:320]}
              rows.append(row);print('FINAL|'+label+'|'+action+'|'+method+'|'+row['http']+f'|{sec:.3f}|'+row['preview'],flush=True);return row
          def stat(name, vals):
              x=[r['seconds'] for r in vals];print(f'SUMMARY|{name}|median={statistics.median(x):.3f}|min={min(x):.3f}|max={max(x):.3f}|samples='+','.join(f'{v:.3f}' for v in x),flush=True)
              return {'name':name,'median':statistics.median(x),'min':min(x),'max':max(x),'samples':x,'http':[r['http'] for r in vals]}
          summaries=[]
          status=[]
          for i in range(3):status.append(call(f'status_{i+1}','status',{},'GET',60));time.sleep(.7)
          summaries.append(stat('status',status))
          share=[]; avatar=[]; deletion=[]; delete_status=[]
          for i in range(3):
              uid=f'github_final_{TS}_{i+1}';alias=f'{uid}_alias';author=f'{uid}_author';sync='mk_'+hashlib.sha256(uid.encode()).hexdigest()[:40]
              share.append(call(f'share_preference_set_{i+1}','share_preference_set',{'userId':uid,'enabled':'1','price_enabled':'0'},'GET',180));time.sleep(.7)
              avatar.append(call(f'profile_avatar_save_frame_{i+1}','profile_avatar_save_frame',{'userId':uid,'imageData':'data:image/png;base64,iVBORw0KGgo='},'POST',180));time.sleep(.7)
              req=f'acct_final_{TS}_{i+1}'
              deletion.append(call(f'account_delete_frame_{i+1}','account_delete_frame',{'requestId':req,'userId':uid,'userIds':json.dumps([uid,alias,author]),'miteRecoToken':'','syncKey':sync,'confirm':'DELETE_ACCOUNT'},'POST',420));time.sleep(.7)
              delete_status.append(call(f'account_delete_status_{i+1}','account_delete_status',{'requestId':req},'GET',120));time.sleep(.7)
          summaries.append(stat('share_preference_set_actual_get',share))
          summaries.append(stat('profile_avatar_save_frame_rejection',avatar))
          summaries.append(stat('account_delete_frame',deletion))
          summaries.append(stat('account_delete_status_after',delete_status))
          json.dump({'rows':rows,'summary':summaries},open('final-slow-path-recheck.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Upload final recheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-31233-final-slow-path-recheck
          path: final-slow-path-recheck.json
