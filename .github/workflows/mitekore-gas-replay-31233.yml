name: MiteKore 3.12.33 Remaining Routes Benchmark
on:
  push:
    paths:
      - '.github/workflows/mitekore-gas-replay-31233.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Replay all remaining routes against current MiteKore GAS
        shell: bash
        run: |
          set -euo pipefail
          HIST='https://raw.githubusercontent.com/sakusakuchoco0109-dotcom/Jan-tool/9c0bfa6f28bce91ea4c6935cb6e9d53551958a0c/.github/workflows/mitekore-gas-remaining-benchmark.yml'
          curl -fsSL "$HIST" -o /tmp/historical.yml
          sed -i "s/APP='20.2.35.652'/APP='RC1.4.640-stall-resilience'/g" /tmp/historical.yml
          awk '/run: \|/ {p=1; next} p && /^      - name:/ {exit} p {sub(/^          /, ""); print}' /tmp/historical.yml > /tmp/replay.sh
          chmod +x /tmp/replay.sh
          echo 'REPLAY_SOURCE|9c0bfa6f28bce91ea4c6935cb6e9d53551958a0c|MiteKore-current-3.12.33'
          bash /tmp/replay.sh

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-gas-remaining-benchmark-31233
          path: mitekore-gas-remaining-benchmark.json
