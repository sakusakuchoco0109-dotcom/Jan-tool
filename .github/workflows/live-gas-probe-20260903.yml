      - '.github/workflows/live-gas-probe-20260903.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe current GAS candidates
        shell: bash
        run: |
          set +e
          urls=(
            'https://script.google.com/macros/s/AKfycbxMOajugsg8XoDJQxqIDCrOSY6DZxAeYDXGdX7eQrbLtMQ4RLwmJsR3nPgsCUXkz0Tl/exec'
