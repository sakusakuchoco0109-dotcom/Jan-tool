          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "=== CANDIDATE $i ${u} ==="
            for qs in 'action=ping' 'action=title_lookup&title=%E3%82%B9%E3%83%BC%E3%83%91%E3%83%BC%E3%83%9E%E3%83%AA%E3%82%AA%E3%83%96%E3%83%A9%E3%82%B6%E3%83%BC%E3%82%BA&platform=FC' 'action=camera_jan_lookup&jan=4902370832310'; do
              echo "-- $qs"
              curl -L -sS --max-time 18 -w '\nHTTP=%{http_code} TOTAL=%{time_total}\n' "$u?$qs&_=$(date +%s%N)" | head -c 1800
              echo
            done
          done
