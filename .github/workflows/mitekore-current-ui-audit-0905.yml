name: MiteKore Current UI Audit 0905
on:
  push:
    paths:
      - '.github/workflows/mitekore-current-ui-audit-0905.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare browser
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Diagnose current build UI and GAS
        env:
          APP_URL: https://hilarious-haupia-6e0406.netlify.app/
          GAS_URL: https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const APP=process.env.APP_URL,GAS=process.env.GAS_URL,RUN=String(process.env.GITHUB_RUN_ID||Date.now());
          const UID='fujiya_chatgpt_diag_'+RUN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const report={run:RUN,steps:[],console:[]};
          async function step(name,fn){const t=Date.now();try{const detail=await fn();const row={name,ok:true,ms:Date.now()-t,detail};report.steps.push(row);console.log('PASS',name,JSON.stringify(row));return detail}catch(e){const row={name,ok:false,ms:Date.now()-t,error:String(e&&e.stack||e)};report.steps.push(row);console.error('FAIL',name,JSON.stringify(row));return null}}
          async function init(ctx){await ctx.addInitScript(({uid,gas})=>{localStorage.setItem('fujiya_collection_user_id',uid);localStorage.setItem('fujiya_mitereco_identity_user_v2',uid);localStorage.setItem('fujiya_device_identity_owner_user_v1',uid);localStorage.setItem('fujiya_device_shared_canonical_user_v1',uid);localStorage.setItem('fujiya_collection_user_name','ChatGPT診断');localStorage.setItem('fujiya_collection_profile_v20_1',JSON.stringify({name:'ChatGPT診断',bio:'14710診断',favoritePlatforms:[],favoriteGames:[],links:{},visibility:{}}));localStorage.setItem('fujiya_collection_setup_done_v1','1');localStorage.setItem('fujiya_collection_tutorial_seen_v2_rc1474','1');localStorage.setItem('fujiya_collection_first_run_seen_v20_2_35cn','1');localStorage.setItem('fujiya_collection_share_opt_in_v1','1');localStorage.setItem('fujiya_collection_gas_endpoint',gas);},{uid:UID,gas:GAS});}
          async function dismiss(p){for(const s of ['[data-profile-unlock-close]','#rareBurstCloseBtn','.mike-talk-close','#tutorialCloseBtn','#firstRunCloseBtn','#devicePairCloseBtn','[data-mag-reader-close]','[data-mag-editor-close]','#cardDetailCloseBtn','#cardDetailClose','.detail-modal-close','[data-global-search-close596]']){try{const x=p.locator(s+':visible').first();if(await x.count())await x.click({force:true,timeout:500})}catch{}}}
          async function make(browser,mobile=false){const ctx=await browser.newContext(mobile?{viewport:{width:390,height:844},isMobile:true,hasTouch:true}:{viewport:{width:1440,height:1000}});await init(ctx);const p=await ctx.newPage();p.setDefaultTimeout(25000);p.on('console',m=>{if(['error','warning'].includes(m.type()))report.console.push({type:m.type(),text:m.text().slice(0,700)})});p.on('pageerror',e=>report.console.push({type:'pageerror',text:e.message}));p.on('dialog',d=>d.accept().catch(()=>{}));await p.goto(APP,{waitUntil:'domcontentloaded',timeout:60000});await sleep(7000);await dismiss(p);return p}
          async function jsonp(p,action,params={},timeout=65000){return p.evaluate(({gas,action,params,timeout})=>new Promise((resolve,reject)=>{const cb='__diag_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch{};s.remove()};window[cb]=d=>{cleanup();resolve(d)};const u=new URL(gas);u.searchParams.set('action',action);u.searchParams.set('callback',cb);for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));s.src=u.toString();s.onerror=()=>{cleanup();reject(new Error(action+' load error'))};const timer=setTimeout(()=>{cleanup();reject(new Error(action+' timeout '+timeout))},timeout);document.head.appendChild(s)}),{gas:GAS,action,params,timeout});}
          async function tab(p,t){await dismiss(p);const b=p.locator(`[data-ui-tab="${t}"]:visible`).first();if(!await b.count())throw new Error('main tab missing '+t);await b.click({force:true});await sleep(500)}
          (async()=>{const browser=await chromium.launch({headless:true});try{
            const p=await make(browser,false);
            await step('公開版ビルド識別',async()=>{const x=await p.evaluate(()=>({version:String(window.__FUJIYA_CLIENT_APP_VERSION__||''),like14710:window.__FUJIYA_AUTHORITATIVE_PT_LIKE_14710__===true,dex:!!document.querySelector('#dexSearchInput'),mobileSearchSource:!!document.querySelector('#mobileMoreSheet [data-global-search-open596]'),endpoint:String(window.fujiyaMiteMagazineBridge?.getGasEndpoint?.()||'')}));if(x.version!=='RC1.4.662-device-sync-timeout-fix'||!x.like14710)throw new Error(JSON.stringify(x));return x});
            for(const action of ['deployment_diagnostics','mitekore_feed_meta','mitekore_feed'])await step('GAS_'+action,async()=>{const d=await jsonp(p,action,action==='mitekore_feed'?{limit:100}:{});if(d?.ok===false)throw new Error(JSON.stringify(d));return {ok:d?.ok,version:d?.version,posts:Array.isArray(d?.posts)?d.posts.length:undefined,deleted:Array.isArray(d?.deletedIds)?d.deletedIds.length:undefined,revision:d?.revision}});
            await step('GAS_pt_balance_state',async()=>{const d=await jsonp(p,'pt_balance_state',{userId:UID});if(!d?.ok)throw new Error(JSON.stringify(d));return {version:d.version,available:d.available,earnedTotal:d.earnedTotal}});
            await step('全体検索_MOTHER2_現行導線',async()=>{await p.locator('[data-global-search-open596]:visible').first().click({force:true});const q=p.locator('#globalSearchInput596:visible');await q.fill('MOTHER2');await q.dispatchEvent('input');await p.waitForFunction(()=>document.querySelectorAll('#globalSearchCandidates596 [data-global-search-choice596]').length>0,undefined,{timeout:60000});const detail=await p.evaluate(()=>({count:document.querySelectorAll('#globalSearchCandidates596 [data-global-search-choice596]').length,note:document.querySelector('#globalSearchNote596')?.textContent||'',masterReady:!!window.fujiyaMasterSearchIndexReady?.()}));await p.locator('[data-global-search-close596]:visible').click({force:true});return detail});
            await step('図鑑_MOTHER2_欲しい追加表示解除',async()=>{await tab(p,'dex');const q=p.locator('#dexSearchInput:visible');await q.fill('MOTHER2');await q.dispatchEvent('input');await p.waitForFunction(()=>[...document.querySelectorAll('.dex-card')].some(x=>/MOTHER2/i.test(x.innerText)),undefined,{timeout:60000});let card=p.locator('.dex-card').filter({hasText:'MOTHER2'}).first();const w=card.locator('[data-dex-wishlist]').first();if(!await w.count())throw new Error('want button missing');const before=(await w.innerText()).trim();if(before.includes('解除'))await w.click({force:true});if(before.includes('解除'))await sleep(500);card=p.locator('.dex-card').filter({hasText:'MOTHER2'}).first();let add=card.locator('[data-dex-wishlist]').first();if(!await add.count())throw new Error('add button missing');if((await add.innerText()).includes('欲しい解除')){await add.click({force:true});await sleep(500);add=p.locator('.dex-card').filter({hasText:'MOTHER2'}).first().locator('[data-dex-wishlist]').first()}await add.click({force:true});await sleep(700);await dismiss(p);const more=p.locator('[data-desktop-more]:visible').first();if(!await more.count())throw new Error('desktop more missing');await more.click({force:true});await sleep(250);const bb=p.locator('#desktopMoreMenu [data-desktop-tab="buyback"]:visible').first();if(!await bb.count())throw new Error('buyback more missing');await bb.click({force:true});await sleep(600);const hub=p.locator('#openWishlistListBtn:visible');if(!await hub.count())throw new Error('wishlist hub missing');await hub.click({force:true});await sleep(600);const text=await p.locator('#wishlistListBody').innerText();const found=/MOTHER2/i.test(text);if(!found)throw new Error('wishlist missing MOTHER2');await tab(p,'dex');await q.fill('MOTHER2');await q.dispatchEvent('input');await sleep(700);const rm=p.locator('.dex-card').filter({hasText:'MOTHER2'}).first().locator('[data-dex-wishlist]').first();if(await rm.count()&&(await rm.innerText()).includes('解除'))await rm.click({force:true});return {found,before,listCount:(await p.locator('#wishlistListCount').count())?await p.locator('#wishlistListCount').innerText():''}});
            const m=await make(browser,true);
            await step('スマホ_その他_全体検索',async()=>{const more=m.locator('[data-mobile-more]:visible').first();if(!await more.count())throw new Error('mobile more missing');await more.click({force:true});await sleep(300);const b=m.locator('#mobileMoreSheet [data-global-search-open596]:visible').first();if(!await b.count())throw new Error('mobile global search missing');await b.click({force:true});const q=m.locator('#globalSearchInput596:visible');if(!await q.count())throw new Error('mobile search input missing');await q.fill('MOTHER2');await q.dispatchEvent('input');await m.waitForFunction(()=>document.querySelectorAll('#globalSearchCandidates596 [data-global-search-choice596]').length>0,undefined,{timeout:60000});return {candidates:await m.locator('#globalSearchCandidates596 [data-global-search-choice596]').count()}});
          }finally{report.finishedAt=new Date().toISOString();fs.writeFileSync('current-ui-audit.json',JSON.stringify(report,null,2));console.log('DIAG_SUMMARY',JSON.stringify({passed:report.steps.filter(x=>x.ok).length,failed:report.steps.filter(x=>!x.ok).length,steps:report.steps,console:report.console.slice(-25)}));await browser.close()}if(report.steps.some(x=>!x.ok))process.exitCode=1})().catch(e=>{report.fatal=String(e.stack||e);fs.writeFileSync('current-ui-audit.json',JSON.stringify(report,null,2));console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-current-ui-audit-0905
          path: current-ui-audit.json
