name: MiteKore Full Discovery
on:
  push:
    paths:
      - 'mitekore-full-discovery.js'
      - '.github/workflows/mitekore-full-discovery.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare current production app
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
          curl -fsSL 'https://hilarious-haupia-6e0406.netlify.app/' -o current-index.html
          ASSET=$(grep -oE 'assets/app-core-[A-Za-z0-9._-]+\.js' current-index.html | head -1 || true)
          echo "CURRENT_ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "Current asset: ${ASSET:-not required for color audit}"
      - name: Discover all visible features
        run: node mitekore-full-discovery.js
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-full-discovery
          path: |
            current-index.html
            full-discovery.json
            discovery-*.json
            discovery-*.png
            discovery-fatal.txt
