name: MiteKore Mike Repro 0914
on:
  push:
    paths:
      - 'mitekore-mike-repro-0914.js'
      - '.github/workflows/mitekore-mike-repro-0914.yml'
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare Playwright
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
          node --check mitekore-mike-repro-0914.js
      - name: Run reproduction matrix
        run: node mitekore-mike-repro-0914.js
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-mike-repro-0914
          path: |
            mitekore-mike-repro-0914-result.json
            mike-repro-*.png
