name: MiteKore Coupon Adjustment Test 0906
on:
  push:
    paths:
      - '.github/workflows/mitekore-referral-prep-0905.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Exchange 500 PT for test coupon
        env:
          GAS_URL: https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec
        run: |
          set -euo pipefail
          BUYER='fujiya_chatgpt_refbuyer_33965660943'
          RID='TEST-COUPON-0906-500PT'
          MONTH='2026-09'
          BEFORE=$(curl -fsSL --get "$GAS_URL" --data-urlencode 'action=pt_balance_state' --data-urlencode "userId=$BUYER")
          echo "BEFORE=$BEFORE"
          curl -fsSL -X POST "$GAS_URL" \
            --data-urlencode 'action=pt_coupon_request_frame' \
            --data-urlencode "requestId=$RID" \
            --data-urlencode "requestIdValue=$RID" \
            --data-urlencode "couponRequestId=$RID" \
            --data-urlencode "userId=$BUYER" \
            --data-urlencode "month=$MONTH" \
            --data-urlencode 'clientAvailablePt=500' \
            --data-urlencode 'clientGrossPt=500' > /tmp/coupon_post.html
          sleep 3
          AFTER=$(curl -fsSL --get "$GAS_URL" --data-urlencode 'action=pt_balance_state' --data-urlencode "userId=$BUYER")
          echo "AFTER=$AFTER"
          node -e 'const d=JSON.parse(process.argv[1]); if(Number(d.couponSpent)!==500||Number(d.available)!==0) throw new Error("coupon spend not reflected: "+process.argv[1]); console.log("COUPON_SPEND_OK",JSON.stringify({couponSpent:d.couponSpent,available:d.available,spentTotal:d.spentTotal,earnedTotal:d.earnedTotal}))' "$AFTER"
