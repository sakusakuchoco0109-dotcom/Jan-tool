name: MiteKore 3.12.37 Collection Diagnose
on:
  push:
    paths:
      - '.github/workflows/mitekore-31237-collection-diagnose.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Diagnose collection sync
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess,urllib.parse,json,re,time,random,concurrent.futures,statistics
          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          RUN=str(int(time.time()))+str(random.randint(1000,9999));users=[]
          def curl(url,form=None,timeout=60):
            cmd=['curl','-L','--connect-timeout','10','--max-time',str(timeout),'-sS','-w','\n__M__%{http_code}|%{time_total}']
            if form:
              for k,v in form.items():cmd+=['--data-urlencode',f'{k}={v}']
            cmd+=[url];p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            if p.returncode:return 0,float(timeout),p.stdout,{'timeout':p.returncode==28,'stderr':p.stderr[:150]}
            body,m=p.stdout.rsplit('\n__M__',1);code,sec=m.strip().split('|');return int(code),float(sec),body,{}
          def get(action,params=None,timeout=60):
            q=dict(params or {});q['action']=action;q['_']=str(time.time_ns());c,s,b,e=curl(GAS+'?'+urllib.parse.urlencode(q),timeout=timeout)
            if e:return c,s,{'ok':False,'code':'TRANSPORT_TIMEOUT' if e.get('timeout') else 'TRANSPORT_ERROR','message':e.get('stderr')}
            try:return c,s,json.loads(b)
            except:return c,s,{'ok':False,'code':'JSON_PARSE_FAILED','message':b[:160]}
          def parse(b):
            m=re.search(r'window\.parent\.postMessage\((\{.*?\}),\s*["\']\*["\']\)',b,re.S)
            if m:
              try:return json.loads(m.group(1)).get('payload') or {}
              except:pass
            return {'ok':False,'code':'POSTMESSAGE_PARSE_FAILED'}
          def post(action,fields,rid,timeout=70):
            f={'action':action,'requestId':rid};f.update(fields);c,s,b,e=curl(GAS,f,timeout)
            if e:return c,s,{'ok':False,'code':'TRANSPORT_TIMEOUT' if e.get('timeout') else 'TRANSPORT_ERROR'}
            return c,s,parse(b)
          def poll(rid):
            last={}
            for _ in range(6):
              _,_,last=get('collection_sync_status',{'requestId':rid},40)
              if last.get('status') in ('completed','error'):return last
              time.sleep(.7)
            return last
          def busy(d):
            t=(str(d.get('code',''))+' '+str(d.get('message',''))).upper();return 'BUSY' in t or '混み合' in t
          for i in range(3):_,s,st=get('status');print('STATUS|%.3f|%s'%(s,st.get('version')));time.sleep(.5)
          if st.get('version')!='3.12.37':raise SystemExit(0)
          def col(uid,idx):
            users.append(uid);payload=json.dumps({'app':'fujiya_collection','userId':uid,'records':[]},separators=(',',':'));hist=[];t=time.time()
            for a in range(1,5):
              rid='loadtest_coldiag_%s_%d_%d'%(RUN,idx,a);_,s,d=post('collection_sync_frame',{'payload':payload},rid,60)
              p=poll(rid)
              if p:d=p
              hist.append({'a':a,'post_sec':s,'ok':d.get('ok'),'status':d.get('status'),'code':d.get('code'),'msg':d.get('message')})
              if d.get('ok') is True and d.get('status')=='completed':return {'ok':True,'attempts':a,'wall':time.time()-t,'hist':hist}
              if not busy(d):return {'ok':False,'attempts':a,'wall':time.time()-t,'hist':hist}
              if a<4:time.sleep([.7,1.1,1.6][a-1]+random.random()*.25)
            return {'ok':False,'attempts':4,'wall':time.time()-t,'hist':hist}
          one=col('loadtest_coldiag_one_'+RUN,1);print('ONE|'+json.dumps(one,ensure_ascii=False,separators=(',',':')))
          time.sleep(5)
          ids=['loadtest_coldiag_four_%s_%d'%(RUN,i) for i in range(4)]
          t=time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:rows=list(ex.map(lambda q:col(q[1],10+q[0]),enumerate(ids)))
          print('FOUR|success=%d/4|wall=%.3f|median=%.3f|max=%.3f'%(sum(x['ok'] for x in rows),time.time()-t,statistics.median(x['wall'] for x in rows),max(x['wall'] for x in rows)))
          for x in rows:print('DETAIL|'+json.dumps(x,ensure_ascii=False,separators=(',',':')))
          # cleanup unique ids
          ids=list(dict.fromkeys(users));rid='loadtest_coldiag_cleanup_'+RUN;post('account_delete_frame',{'confirm':'DELETE_ACCOUNT','userIds':json.dumps(ids,separators=(',',':'))},rid,180)
          clean={}
          for _ in range(10):
            _,_,clean=get('account_delete_status',{'requestId':rid},40)
            if clean.get('status') in ('completed','error'):break
            time.sleep(.8)
          print('CLEANUP|status=%s|deleted=%s|remaining=%s|expected=%d'%(clean.get('status'),clean.get('deleted_users'),clean.get('remaining_records'),len(ids)))
          PY
