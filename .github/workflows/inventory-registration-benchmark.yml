name: Fujiya Inventory Registration Benchmark
on:
  push:
    paths:
      - '.github/workflows/inventory-registration-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Measure registration-related GAS path
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess, urllib.parse, json, time, statistics, re
          GAS='https://script.google.com/macros/s/AKfycbxoqua0rvTXWabQSPYnJ9wvjYP8EZ0L5i-PlAwZclreciDwtmAS6dJeBXNjJrScqijm1A/exec'
          WRITE_KEY='hPHBjEyL6yDgXDkZN78v3BoSjfe_LGDg'

          def call(label, params, timeout=90):
              q=dict(params)
              cb='benchCb'+str(int(time.time()*1000))
              q['callback']=cb
              q['_']=str(int(time.time()*1000))
              url=GAS+'?'+urllib.parse.urlencode(q)
              out='/tmp/'+re.sub(r'[^a-zA-Z0-9_-]','_',label)+'.txt'
              cmd=['curl','-L','--max-time',str(timeout),'-sS','-o',out,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}',url]
              try:
                  metric=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT).strip()
              except subprocess.CalledProcessError as e:
                  metric='ERR|0|0|0'; print('CURLERR',label,e.output,flush=True)
              try: body=open(out,encoding='utf-8',errors='ignore').read()
              except: body=''
              payload=None
              m=re.match(r'^[^(]+\((.*)\)\s*;?\s*$',body,re.S)
              raw=m.group(1) if m else body
              try: payload=json.loads(raw)
              except: pass
              print('RESULT|'+label+'|'+metric+'|'+(str(payload)[:1200] if payload is not None else body[:500].replace('\n',' ')),flush=True)
              parts=metric.split('|')
              return {'label':label,'metric':metric,'http':parts[0] if parts else '', 'seconds':float(parts[1]) if len(parts)>1 and parts[1].replace('.','',1).isdigit() else None,'payload':payload}

          tests=[
            ('ping', {'action':'ping'}),
            ('jan_lookup', {'action':'jan_lookup','jan':'4902370501629','force':'0'}),
            ('title_lookup', {'action':'title_lookup','title':'スターフォックス','platform':'SFC','edition_label':''}),
            ('model_lookup', {'action':'model_lookup','model':'SHVC-FO','force':'0'}),
            ('write_status_missing', {'action':'product_master_write_status','write_key':WRITE_KEY,'write_request_key':'benchmark_missing_'+str(int(time.time()*1000))}),
          ]
          allrows=[]
          for label,params in tests:
              vals=[]
              for i in range(5):
                  r=call(f'{label}_{i+1}',params,60);allrows.append(r)
                  if r['seconds'] is not None: vals.append(r['seconds'])
                  time.sleep(.4)
              if vals:
                  print(f'SUMMARY|{label}|median={statistics.median(vals):.3f}|min={min(vals):.3f}|max={max(vals):.3f}|mean={statistics.mean(vals):.3f}',flush=True)

          # 実運用と同じ product_master_upsert。既存スターフォックスへ同じ業務データを再送し、内容自体は変更しない。
          ts=int(time.time()*1000)
          write_key=f'github_inventory_bench_{ts}'
          upsert={
            'action':'product_master_upsert','write_key':WRITE_KEY,'mode':'update','overwrite_title_master':'1',
            'product_master_id':'SFC-P002468','shared_title_id':'SFC-G002468','platform':'SFC','title':'スターフォックス',
            'edition_label':'','jan':'4902370501629','model':'SHVC-FO','maker':'任天堂','release_date':'1993-02-21',
            'genre':'シューティング','source_label':'PRODUCT_MASTER','source_url':'','sync_title_master':'1',
            'overwrite_fields':'1','overwrite_jan':'1','write_request_key':write_key
          }
          wr=call('product_master_upsert_same_data',upsert,120);allrows.append(wr)
          print(f'WRITEKEY|{write_key}',flush=True)

          # 応答が processing の場合も含め、完了確認を実運用と同じ2.5秒間隔で追う。
          start=time.time(); status_rows=[]; final=None
          for i in range(12):
              sr=call(f'write_status_after_upsert_{i+1}',{'action':'product_master_write_status','write_key':WRITE_KEY,'write_request_key':write_key},30)
              status_rows.append(sr); allrows.append(sr)
              p=sr.get('payload') or {}
              if p.get('state') in ('done','failed'):
                  final=p; break
              time.sleep(2.5)
          confirm=time.time()-start
          print(f'SUMMARY|upsert_direct|seconds={wr.get("seconds")}|confirm_elapsed={confirm:.3f}|final_state={(final or {}).get("state")}',flush=True)

          open('inventory-registration-benchmark.json','w').write(json.dumps({
            'endpoint':GAS,
            'rows':[{k:v for k,v in r.items() if k!='payload'}|{'payload':r.get('payload')} for r in allrows],
            'upsertDirectSeconds':wr.get('seconds'),'confirmElapsedSeconds':confirm,'finalState':(final or {}).get('state')
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-registration-benchmark
          path: inventory-registration-benchmark.json
