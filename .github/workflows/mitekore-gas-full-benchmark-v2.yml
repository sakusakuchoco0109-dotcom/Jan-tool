name: MiteKore GAS Full Benchmark V2
on:
  push:
    paths:
      - '.github/workflows/mitekore-gas-full-benchmark-v2.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected benchmark
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/mitekore-gas-full-benchmark.yml').read_text(encoding='utf-8')
          start=src.index("          cat > /tmp/bench.py <<'PY'\n")+len("          cat > /tmp/bench.py <<'PY'\n")
          end=src.index("\n          PY\n",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          code=code.replace('{sec:.6f}','{seconds:.6f}')
          Path('/tmp/bench.py').write_text(code,encoding='utf-8')
          PY
          python3 /tmp/bench.py
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-gas-full-benchmark-v2
          path: gas-full-benchmark.json
