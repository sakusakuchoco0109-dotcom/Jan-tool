name: MiteKore GAS 3.12.31 Targeted Retest
on:
  push:
    paths:
      - '.github/workflows/mitekore-gas-31231-targeted-retest.yml'
  workflow_dispatch:

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retest outliers three times
        shell: bash
        run: |
          cat > /tmp/retest.py <<'PY'
          import subprocess, json, time, urllib.parse, statistics, datetime
          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          APP='20.2.35.652'
          ts=str(int(time.time()*1000)); uid='github_target_'+ts; token='github_target_edit_'+ts+'_safe'
          rows=[]
          def get(label,action,params=None,maxt=240,show=False):
            p=dict(params or {}); p['action']=action; p['_']=str(int(time.time()*1000)); url=GAS+'?'+urllib.parse.urlencode(p); out='/tmp/'+label+'.out'
            cmd=['curl','-L','--max-time',str(maxt),'-sS','-o',out,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}',url]
            try:m=subprocess.check_output(cmd,text=True).strip()
            except:m='ERR|0|0|0'
            h,t,tt,b=m.split('|'); r={'label':label,'http':h,'seconds':float(t),'ttfb':float(tt),'bytes':int(float(b))}; rows.append(r); print('BENCH|'+label+'|'+h+'|'+t+'|'+tt+'|'+b,flush=True)
            if show:
              try: print('BODY|'+open(out,encoding='utf-8').read()[:600].replace('\n',' '),flush=True)
              except: pass
            return r
          def post(label,action,fields=None,maxt=240):
            p=dict(fields or {}); p['action']=action; p.setdefault('requestId','req_'+label+'_'+str(int(time.time()*1000))); p.setdefault('appVersion',APP); out='/tmp/'+label+'.out'
            cmd=['curl','-L','--max-time',str(maxt),'-sS','-o',out,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}']
            for k,v in p.items():cmd+=['--data-urlencode',f'{k}={v}']
            cmd.append(GAS)
            try:m=subprocess.check_output(cmd,text=True).strip()
            except:m='ERR|0|0|0'
            h,t,tt,b=m.split('|'); r={'label':label,'http':h,'seconds':float(t),'ttfb':float(tt),'bytes':int(float(b))}; rows.append(r); print('BENCH|'+label+'|'+h+'|'+t+'|'+tt+'|'+b,flush=True); return r

          get('status','status',show=True)
          for i in range(1,4):
            get(f'stats_{i}','stats',{},240)
            get(f'pt_balance_{i}','pt_content_reward_balance',{'userId':uid},180)
            get(f'pt_history_{i}','pt_content_reward_history',{'userId':uid,'limit':'30'},180)
            get(f'camera_jan_{i}','camera_jan_lookup',{'jan':'4902370504912'},180)
            get(f'feed_{i}','mitekore_feed',{'limit':'80'},180)
            get(f'mag_light_{i}','magazine_list_light',{'limit':'20','offset':'0','coverLimit':'4'},180)

          # Three isolated comment create/delete cycles
          for i in range(1,4):
            now=datetime.datetime.now(datetime.timezone.utc).isoformat(); parent=f'mh_target_parent_{ts}_{i}'; comment=f'mh_target_comment_{ts}_{i}'
            pj=json.dumps({'id':parent,'type':'url','text':'target retest','createdAt':now,'updatedAt':now,'author':{'userId':uid,'userName':'GitHub Target','nickname':'','avatar':''},'attachment':{'url':'https://example.com/','commentsEnabled':True},'shared':False,'source':'github_target'},ensure_ascii=False,separators=(',',':'))
            cj=json.dumps({'id':comment,'type':'comment','text':'target retest comment','createdAt':now,'updatedAt':now,'author':{'userId':uid,'userName':'GitHub Target','nickname':'','avatar':''},'attachment':{'comment':{'parentId':parent,'parentAuthorName':'GitHub Target'}},'shared':False,'source':'github_target'},ensure_ascii=False,separators=(',',':'))
            post(f'parent_save_{i}','mitekore_post_save_frame',{'postJson':pj,'editToken':token})
            post(f'comment_save_{i}','mitekore_post_save_frame',{'postJson':cj,'editToken':token})
            post(f'comment_delete_{i}','mitekore_post_delete_frame',{'postId':comment,'userId':uid,'editToken':token},240)
            post(f'parent_delete_{i}','mitekore_post_delete_frame',{'postId':parent,'userId':uid,'editToken':token},240)

          groups={}
          for r in rows:
            base=r['label']
            for prefix in ['stats_','pt_balance_','pt_history_','camera_jan_','feed_','mag_light_','comment_delete_','comment_save_','parent_save_','parent_delete_']:
              if base.startswith(prefix): groups.setdefault(prefix.rstrip('_'),[]).append(r['seconds'])
          summary={k:{'values':v,'median':statistics.median(v),'mean':statistics.mean(v),'min':min(v),'max':max(v)} for k,v in groups.items()}
          print('=== SUMMARY ===',flush=True); print(json.dumps(summary,ensure_ascii=False,separators=(',',':')),flush=True)
          with open('gas-31231-targeted-retest.json','w',encoding='utf-8') as f:json.dump({'rows':rows,'summary':summary},f,ensure_ascii=False,indent=2)
          PY
          python3 /tmp/retest.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-gas-31231-targeted-retest
          path: gas-31231-targeted-retest.json
