name: MiteKore Delete Sync Proof 0905
on:
  push:
    paths:
      - '.github/workflows/mitekore-delete-sync-proof-0905.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare browser
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Prove remote commit comment and delete propagation
        env:
          APP_URL: https://hilarious-haupia-6e0406.netlify.app/
          GAS_URL: https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs');
          const APP=process.env.APP_URL,GAS=process.env.GAS_URL,RUN=String(process.env.GITHUB_RUN_ID);
          const A='fujiya_chatgpt_delA_'+RUN,B='fujiya_chatgpt_delB_'+RUN,NA='ChatGPT削除A_'+RUN.slice(-6),NB='ChatGPT削除B_'+RUN.slice(-6);
          const TEXT='削除反映確認 '+RUN.slice(-8),COMM='削除コメント '+RUN.slice(-8);const sleep=ms=>new Promise(r=>setTimeout(r,ms));const out={run:RUN,steps:[]};
          function log(name,d={}){out.steps.push({name,...d});console.log(name,JSON.stringify(d))}
          async function dismiss(p){for(const s of ['[data-profile-unlock-close]','#rareBurstCloseBtn','.mike-talk-close','#tutorialCloseBtn','#firstRunCloseBtn','#devicePairCloseBtn','[data-mag-reader-close]','[data-mag-editor-close]','#cardDetailCloseBtn','#cardDetailClose','.detail-modal-close']){try{const e=p.locator(s+':visible').first();if(await e.count())await e.click({force:true,timeout:500})}catch{}}}
          async function make(browser,uid,name){const c=await browser.newContext({viewport:{width:1440,height:1000}});await c.addInitScript(({uid,name,gas})=>{localStorage.setItem('fujiya_collection_user_id',uid);localStorage.setItem('fujiya_mitereco_identity_user_v2',uid);localStorage.setItem('fujiya_device_identity_owner_user_v1',uid);localStorage.setItem('fujiya_device_shared_canonical_user_v1',uid);localStorage.setItem('fujiya_collection_user_name',name);localStorage.setItem('fujiya_collection_profile_v20_1',JSON.stringify({name,bio:'削除確認',favoritePlatforms:[],favoriteGames:[],links:{},visibility:{}}));localStorage.setItem('fujiya_collection_setup_done_v1','1');localStorage.setItem('fujiya_collection_tutorial_seen_v2_rc1474','1');localStorage.setItem('fujiya_collection_first_run_seen_v20_2_35cn','1');localStorage.setItem('fujiya_collection_share_opt_in_v1','1');localStorage.setItem('fujiya_collection_gas_endpoint',gas);},{uid,name,gas:GAS});const p=await c.newPage();p.setDefaultTimeout(25000);p.on('dialog',d=>d.accept().catch(()=>{}));await p.goto(APP,{waitUntil:'domcontentloaded',timeout:60000});await sleep(6500);await dismiss(p);return p}
          async function jsonp(p,action,params={},timeout=60000){return p.evaluate(({gas,action,params,timeout})=>new Promise((resolve,reject)=>{const cb='__del_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;const clean=()=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch{};s.remove()};window[cb]=d=>{clean();resolve(d)};const u=new URL(gas);u.searchParams.set('action',action);u.searchParams.set('callback',cb);for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));s.src=u.toString();s.onerror=()=>{clean();reject(new Error(action+' load error'))};const t=setTimeout(()=>{clean();reject(new Error(action+' timeout'))},timeout);document.head.appendChild(s)}),{gas:GAS,action,params,timeout})}
          async function openFeed(p){await dismiss(p);await p.locator('[data-ui-tab="magazine"]:visible').first().click({force:true});await sleep(700);const k=p.locator('[data-mag-view="mitekore"]:visible').first();if(await k.count())await k.click({force:true});else await p.evaluate(()=>window.fujiyaMiteHoshii?.open?.());await sleep(700);await dismiss(p)}
          function card(p){return p.locator('#miteHoshiiFeed .mh-card[data-mh-post]').filter({hasText:TEXT}).first()}
          async function waitRemoteShared(p,id,timeout=90000){const t=Date.now();while(Date.now()-t<timeout){const rows=await p.evaluate(()=>window.fujiyaMiteHoshii?.getPosts?.()||[]);const r=rows.find(x=>String(x?.id||'')===id);if(r?.shared===true)return Date.now()-t;await sleep(1000)}throw new Error('A remote commit not confirmed')}
          async function waitFeedHas(p,id,timeout=90000){const t=Date.now();while(Date.now()-t<timeout){const d=await jsonp(p,'mitekore_feed',{limit:100},60000);if((d.posts||[]).some(x=>String(x?.id||'')===id))return Date.now()-t;await sleep(1800)}throw new Error('server feed missing '+id)}
          async function waitB(p,timeout=90000){const t=Date.now();while(Date.now()-t<timeout){await p.evaluate(()=>window.fujiyaRefreshMitekoreSharedFeed553f12?.());await sleep(700);if(await card(p).count())return Date.now()-t;await sleep(1200)}throw new Error('B UI did not receive post')}
          async function waitServerGone(p,id,timeout=90000){const t=Date.now();while(Date.now()-t<timeout){const d=await jsonp(p,'mitekore_feed',{limit:100},60000);const has=(d.posts||[]).some(x=>String(x?.id||'')===id),del=(d.deletedIds||[]).map(String).includes(id);if(!has&&del)return Date.now()-t;await sleep(1500)}throw new Error('server delete not confirmed')}
          (async()=>{const browser=await chromium.launch({headless:true});let pa,pb,postId='';try{pa=await make(browser,A,NA);pb=await make(browser,B,NB);await openFeed(pa);const toggle=pa.locator('#mhComposerToggle547:visible');if(await toggle.count())await toggle.click({force:true});await pa.locator('[data-mh-type="url"]:visible').first().click({force:true});await pa.locator('#mhUrlInput:visible').fill('https://example.com/delete-proof-'+RUN);await pa.locator('#mhUrlInput:visible').dispatchEvent('input');await pa.locator('#mhComment:visible').fill(TEXT);await pa.locator('#mhComment:visible').dispatchEvent('input');const ce=pa.locator('#mhCommentsEnabled:visible');if(await ce.count()&&await ce.getAttribute('aria-checked')==='false')await ce.click({force:true});await pa.locator('#mhSubmit:visible').click({force:true});await pa.waitForFunction(t=>[...document.querySelectorAll('#miteHoshiiFeed .mh-card[data-mh-post]')].some(x=>x.innerText.includes(t)),TEXT,{timeout:25000});postId=await card(pa).getAttribute('data-mh-post');log('POST_LOCAL',{postId});const saveMs=await waitRemoteShared(pa,postId);log('POST_REMOTE_COMMIT',{saveMs});const feedMs=await waitFeedHas(pa,postId);log('POST_SERVER_FEED',{feedMs});await openFeed(pb);const bMs=await waitB(pb);log('POST_VISIBLE_B',{bMs});
            let c=card(pb);await c.locator('[data-mh-comment-open43]').first().click({force:true});await sleep(500);await pb.locator('[data-mh-comment-input43]:visible').fill(COMM);await pb.locator('[data-mh-comment-input43]:visible').dispatchEvent('input');await pb.locator('[data-mh-comment-submit43]:visible').click({force:true});await pb.waitForFunction(t=>document.querySelector('#mhCommentModal43')?.innerText.includes(t),COMM,{timeout:25000});let commentId='';const ct=Date.now();while(Date.now()-ct<90000){const d=await jsonp(pb,'mitekore_comments',{parentId:postId,limit:200},60000);const found=(d.comments||[]).find(x=>String(x?.text||'').includes(COMM));if(found){commentId=String(found.id||'');break}await sleep(1200)}if(!commentId)throw new Error('comment remote commit not confirmed');log('COMMENT_REMOTE_COMMIT',{commentId});const row=pb.locator('#mhCommentModal43 .mh-comment-row43').filter({hasText:COMM}).first();const delc=row.locator('[data-mh-comment-delete43]').first();if(!await delc.count())throw new Error('comment delete missing');await delc.click({force:true});const cdt=Date.now();while(Date.now()-cdt<90000){const d=await jsonp(pb,'mitekore_comments',{parentId:postId,limit:200},60000);if(!(d.comments||[]).some(x=>String(x?.id||'')===commentId)&&(d.deletedIds||[]).map(String).includes(commentId))break;await sleep(1200)}const afterC=await jsonp(pb,'mitekore_comments',{parentId:postId,limit:200},60000);if((afterC.comments||[]).some(x=>String(x?.id||'')===commentId))throw new Error('comment remains on server');log('COMMENT_DELETE_SERVER_OK');await pb.locator('[data-mh-comment-close43]:visible').click({force:true}).catch(()=>{});
            await openFeed(pa);c=card(pa);if(!await c.count())throw new Error('author post missing before delete');await c.locator('[data-mh-more-open611]').first().click({force:true});await sleep(250);const del=pa.locator('[data-mh-more-delete611]:visible').first();if(!await del.count())throw new Error('post delete missing');await del.click({force:true});const delMs=await waitServerGone(pa,postId);log('POST_DELETE_SERVER_OK',{delMs});await pa.evaluate(()=>window.fujiyaRefreshMitekoreSharedFeed553f12?.());await sleep(600);if(await card(pa).count())throw new Error('A still sees deleted post');log('POST_DELETE_A_OK');const bt=Date.now();while(Date.now()-bt<90000){await pb.evaluate(()=>window.fujiyaRefreshMitekoreSharedFeed553f12?.());await sleep(650);if(!await card(pb).count())break;await sleep(1200)}if(await card(pb).count())throw new Error('B still sees deleted post');log('POST_DELETE_B_OK',{ms:Date.now()-bt});
          }finally{fs.writeFileSync('delete-sync-proof.json',JSON.stringify(out,null,2));await browser.close()}})().catch(e=>{out.error=String(e.stack||e);fs.writeFileSync('delete-sync-proof.json',JSON.stringify(out,null,2));console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-delete-sync-proof-0905
          path: delete-sync-proof.json
