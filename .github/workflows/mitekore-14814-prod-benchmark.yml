name: MiteKore 14814 Prod Benchmark
on:
  push:
    paths:
      - '.github/workflows/mitekore-14814-prod-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Run production browser benchmark
        env:
          SITE: https://hilarious-haupia-6e0406.netlify.app/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const SITE=process.env.SITE;
          const med=a=>{const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
          const fmt=n=>Number(n).toFixed(3);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const page=await context.newPage();
            page.on('console',m=>{if(['error'].includes(m.type()))console.log('BROWSER_CONSOLE',m.type(),m.text().slice(0,400));});
            const navStart=Date.now();
            const resp=await page.goto(SITE+'?prodbench='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            const domMs=Date.now()-navStart;
            await page.waitForFunction(()=>window.__FUJIYA_CLIENT_APP_VERSION__&&typeof window.fujiyaHedgedGasRead14814==='function',{timeout:120000});
            const version=await page.evaluate(()=>String(window.__FUJIYA_CLIENT_APP_VERSION__||''));
            console.log('PROD_HTTP',resp?.status(),'DOM_MS',domMs,'VERSION',version);
            if(!version.startsWith('14814-')) throw new Error('Production is not 14814: '+version);

            async function run(label, makeOpts, n=3){
              const rows=[];
              for(let i=0;i<n;i++){
                const result=await page.evaluate(async ({opts,label})=>{
                  window.__FUJIYA_HEDGED_READ_DIAG__={started:0,primaryWins:0,hedgeWins:0,failures:0,activeHedges:0,last:null};
                  const t=performance.now();
                  try{
                    const data=await window.fujiyaHedgedGasRead14814(opts);
                    return {ok:true,ms:performance.now()-t,diag:window.__FUJIYA_HEDGED_READ_DIAG__,keys:Object.keys(data||{}),data};
                  }catch(e){return {ok:false,ms:performance.now()-t,error:String(e?.message||e),diag:window.__FUJIYA_HEDGED_READ_DIAG__};}
                },{opts:makeOpts(),label});
                const summary={ok:result.ok,ms:result.ms,source:result.diag?.last?.source||'',err:result.error||''};
                console.log('SAMPLE',label,i+1,JSON.stringify(summary));
                if(!result.ok) throw new Error(label+' failed: '+result.error);
                rows.push(result);
                await page.waitForTimeout(900);
              }
              const times=rows.map(r=>r.ms/1000);
              const out={label,min:Math.min(...times),median:med(times),max:Math.max(...times),sources:rows.map(r=>r.diag?.last?.source||'')};
              console.log('RESULT',JSON.stringify(out));
              return {rows,out};
            }

            const list=await run('magazine_list_light',()=>({
              jsonpAction:'magazine_list_light',frameAction:'magazine_list_light_frame',
              params:{limit:'30',offset:'0',coverLimit:'4',knownRevision:''},
              fields:{limit:'30',offset:'0',coverLimit:'4',knownRevision:''},
              hedgeDelayMs:2800,jsonpTimeoutMs:12000,frameTimeoutMs:14000,
              validate:d=>!!d&&d.ok!==false&&Array.isArray(d.articles)
            }));
            const articleId=list.rows[0].data?.articles?.[0]?.id||list.rows[0].data?.articles?.[0]?.articleId;
            if(!articleId) throw new Error('No article id from production list');
            console.log('ARTICLE_ID',articleId);

            await run('magazine_read',()=>({
              jsonpAction:'magazine_read',frameAction:'magazine_read_frame',
              params:{articleId,userId:''},fields:{articleId,userId:''},
              hedgeDelayMs:3000,jsonpTimeoutMs:12000,frameTimeoutMs:14000,
              validate:d=>!!d&&d.ok!==false&&!!d.article
            }));

            await run('magazine_comments',()=>({
              jsonpAction:'magazine_comments',frameAction:'magazine_comments_frame',
              params:{articleId,limit:'80'},fields:{articleId,limit:'80'},
              hedgeDelayMs:2600,jsonpTimeoutMs:10000,frameTimeoutMs:12000,
              validate:d=>!!d&&d.ok!==false&&Array.isArray(d.comments)
            }));

            const parentId='mh_fe3cffd5-5bd6-4c5b-9623-f70499af22e7';
            await run('mitekore_comments',()=>({
              jsonpAction:'mitekore_comments',frameAction:'mitekore_comments_frame',
              params:{parentId,limit:'200'},fields:{parentId,limit:'200'},
              hedgeDelayMs:2600,jsonpTimeoutMs:10000,frameTimeoutMs:12000,
              validate:d=>!!d&&d.ok!==false&&Array.isArray(d.comments)
            }));

            // Forced stall: delay only GET magazine_read. POST iframe remains untouched.
            let delayed=false;
            await page.route('**/*',async route=>{
              const req=route.request(); const url=req.url();
              if(!delayed && req.method()==='GET' && url.includes('script.google.com/macros/') && url.includes('action=magazine_read')){
                delayed=true; console.log('FORCED_STALL_INTERCEPTED',url.slice(0,180));
                await new Promise(r=>setTimeout(r,6500));
              }
              await route.continue();
            });
            const forced=await page.evaluate(async articleId=>{
              window.__FUJIYA_HEDGED_READ_DIAG__={started:0,primaryWins:0,hedgeWins:0,failures:0,activeHedges:0,last:null};
              const t=performance.now();
              try{
                const data=await window.fujiyaHedgedGasRead14814({
                  jsonpAction:'magazine_read',frameAction:'magazine_read_frame',
                  params:{articleId,userId:''},fields:{articleId,userId:''},
                  hedgeDelayMs:3000,jsonpTimeoutMs:12000,frameTimeoutMs:14000,
                  validate:d=>!!d&&d.ok!==false&&!!d.article
                });
                return {ok:true,ms:performance.now()-t,diag:window.__FUJIYA_HEDGED_READ_DIAG__,id:data?.article?.id||''};
              }catch(e){return {ok:false,ms:performance.now()-t,error:String(e?.message||e),diag:window.__FUJIYA_HEDGED_READ_DIAG__};}
            },articleId);
            console.log('FORCED_STALL_RESULT',JSON.stringify({ok:forced.ok,seconds:forced.ms/1000,source:forced.diag?.last?.source,diag:forced.diag,error:forced.error||''}));
            if(!forced.ok) throw new Error('Forced stall read failed: '+forced.error);
            if(forced.diag?.last?.source!=='hedge') throw new Error('Forced stall did not use hedge: '+JSON.stringify(forced.diag));

            console.log('BENCHMARK_OK');
            await browser.close();
          })().catch(async e=>{console.error('BENCHMARK_FATAL',e);process.exit(2);});
          NODE
