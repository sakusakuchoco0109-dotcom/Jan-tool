name: MiteKore GAS 3.12.31 Rebenchmark
on:
  push:
    paths:
      - '.github/workflows/mitekore-gas-31231-rebench.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Benchmark deployed GAS
        shell: bash
        run: |
          cat > /tmp/bench.py <<'PY'
          import subprocess, json, time, urllib.parse, datetime

          GAS='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          APP='20.2.35.652'
          ts=str(int(time.time()*1000))
          uid='github_rebench_'+ts
          token='github_rebench_edit_'+ts+'_safe'
          results=[]
          cleanup=[]

          def record(label, method, metric, path):
              try: http,total,ttfb,size=metric.strip().split('|')
              except: http,total,ttfb,size='ERR','0','0','0'
              row={'label':label,'method':method,'http':http,'seconds':float(total or 0),'ttfb':float(ttfb or 0),'bytes':int(float(size or 0))}
              results.append(row)
              print(f"BENCH|{label}|{method}|{http}|{row['seconds']:.6f}|{row['ttfb']:.6f}|{row['bytes']}",flush=True)
              return row

          def curl_get(label, action, params=None, max_time=180):
              p=dict(params or {}); p['action']=action; p['_']=str(int(time.time()*1000))
              url=GAS+'?'+urllib.parse.urlencode(p)
              path='/tmp/'+label+'.out'
              cmd=['curl','-L','--max-time',str(max_time),'-sS','-o',path,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}',url]
              try: metric=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT)
              except: metric='ERR|0|0|0'
              return record(label,'GET',metric,path)

          def curl_post(label, action, fields=None, max_time=180):
              p=dict(fields or {}); p['action']=action; p.setdefault('requestId','req_'+label+'_'+ts+'_'+str(int(time.time()*1000))); p.setdefault('appVersion',APP)
              path='/tmp/'+label+'.out'
              cmd=['curl','-L','--max-time',str(max_time),'-sS','-o',path,'-w','%{http_code}|%{time_total}|%{time_starttransfer}|%{size_download}']
              for k,v in p.items(): cmd += ['--data-urlencode',f'{k}={v}']
              cmd.append(GAS)
              try: metric=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT)
              except: metric='ERR|0|0|0'
              return record(label,'POST',metric,path)

          def silent_post(action, fields=None):
              p=dict(fields or {}); p['action']=action; p.setdefault('requestId','cleanup_'+ts+'_'+str(int(time.time()*1000))); p.setdefault('appVersion',APP)
              cmd=['curl','-L','--max-time','120','-sS','-o','/dev/null']
              for k,v in p.items(): cmd += ['--data-urlencode',f'{k}={v}']
              cmd.append(GAS); subprocess.run(cmd,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          # version + representative reads
          curl_get('status','status')
          curl_get('product_master_meta','product_master_meta')
          curl_get('product_master_chunk','product_master_chunk',{'offset':'0','limit':'500'})
          curl_get('camera_jan_lookup','camera_jan_lookup',{'jan':'4902370504912'})
          curl_get('stats_cold','stats',{},240)
          curl_get('stats_warm','stats',{},240)
          curl_get('share_preference_get','share_preference_get',{'userId':uid})
          curl_get('magazine_list_full','magazine_list',{'limit':'20','offset':'0'},240)
          curl_get('magazine_list_light_cold','magazine_list_light',{'limit':'20','offset':'0','coverLimit':'4'})
          curl_get('magazine_list_light_warm','magazine_list_light',{'limit':'20','offset':'0','coverLimit':'4'})
          curl_get('mitekore_feed_cold','mitekore_feed',{'limit':'80'},240)
          curl_get('mitekore_feed_warm','mitekore_feed',{'limit':'80'},240)
          curl_get('title_content_search','title_content_search',{'platform':'FC','title':'スーパーマリオブラザーズ','limit':'30','offset':'0'},180)
          curl_get('pt_balance','pt_content_reward_balance',{'userId':uid})
          curl_get('pt_history','pt_content_reward_history',{'userId':uid,'limit':'30'})
          curl_get('omikuji_state','pt_omikuji_state',{'userId':uid})
          curl_get('playlog_recommend','playlog_recommend',{'userId':uid,'limit':'12'},180)

          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          parent='mh_rebench_parent_'+ts
          comment='mh_rebench_comment_'+ts
          parent_json=json.dumps({'id':parent,'type':'url','text':'GitHub rebenchmark parent','createdAt':now,'updatedAt':now,'author':{'userId':uid,'userName':'GitHub Rebench','nickname':'','avatar':''},'attachment':{'url':'https://example.com/','commentsEnabled':True},'shared':False,'source':'github_rebench'},ensure_ascii=False,separators=(',',':'))
          curl_post('mitekore_post_save','mitekore_post_save_frame',{'postJson':parent_json,'editToken':token})
          cleanup.append(('mitekore_post_delete_frame',{'postId':parent,'userId':uid,'editToken':token}))
          comment_json=json.dumps({'id':comment,'type':'comment','text':'benchmark comment','createdAt':now,'updatedAt':now,'author':{'userId':uid,'userName':'GitHub Rebench','nickname':'','avatar':''},'attachment':{'comment':{'parentId':parent,'parentAuthorName':'GitHub Rebench'}},'shared':False,'source':'github_rebench'},ensure_ascii=False,separators=(',',':'))
          curl_post('mitekore_comment_save','mitekore_post_save_frame',{'postJson':comment_json,'editToken':token})
          cleanup.append(('mitekore_post_delete_frame',{'postId':comment,'userId':uid,'editToken':token}))
          curl_get('mitekore_feed_after_write','mitekore_feed',{'limit':'80'},240)
          curl_post('mitekore_comment_delete','mitekore_post_delete_frame',{'postId':comment,'userId':uid,'editToken':token})
          cleanup=[x for x in cleanup if x[1].get('postId')!=comment]
          curl_post('mitekore_post_delete','mitekore_post_delete_frame',{'postId':parent,'userId':uid,'editToken':token})
          cleanup=[x for x in cleanup if x[1].get('postId')!=parent]

          review='RVrebench_'+ts
          sid='REBENCH-SID-'+ts
          curl_post('review_save','game_review_save_frame',{'reviewId':review,'userId':uid,'userName':'GitHub Rebench','sharedTitleId':sid,'platform':'FC','title':'REBENCH TEST GAME','rating':'4','text':'temporary benchmark review','spoiler':'0','source':'benchmark','toTopic':'0'})
          cleanup.append(('game_review_delete_frame',{'reviewId':review,'userId':uid}))
          curl_post('review_delete','game_review_delete_frame',{'reviewId':review,'userId':uid})
          cleanup=[x for x in cleanup if x[0]!='game_review_delete_frame']

          today=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(hours=9)).strftime('%Y-%m-%d')
          play_title='REBENCH TEST GAME '+ts
          curl_post('playlog_session_save','playlog_session_save_frame',{'userId':uid,'userName':'GitHub Rebench','nickname':'','platform':'TEST','title':play_title,'playedDate':today,'source':'benchmark','note':'benchmark play','privateNote':'','clearFlag':'false','playTimeMinutes':'5','score':'123','scoreUnit':'点','clearTimeSeconds':'0','shareToTopic':'false','editToken':token},240)
          # Find play id then remove
          p={'action':'playlog_user','userId':uid,'limit':'400','_':str(int(time.time()*1000))}
          out='/tmp/play_user.json'; subprocess.run(['curl','-L','--max-time','180','-sS','-o',out,GAS+'?'+urllib.parse.urlencode(p)])
          play_id=''
          try:
              d=json.load(open(out,encoding='utf-8'))
              for r in d.get('logs',[]):
                  if str(r.get('title',''))==play_title: play_id=str(r.get('playId') or r.get('play_id') or '')
          except: pass
          if play_id:
              curl_post('playlog_delete','playlog_delete_frame',{'userId':uid,'playId':play_id})

          article='mag_rebench_'+ts
          mag_comment='mh_mag_rebench_'+ts
          article_obj={'id':article,'authorUserId':uid,'authorName':'GitHub Rebench','authorNickname':'','authorAvatar':'','title':'速度再計測記事','category':'その他','tags':['benchmark'],'body':'GitHub ActionsからGASの速度を再計測する一時記事です。','bodyBlocks':None,'coverData':'','relatedGames':[],'poll':{'enabled':True,'question':'速度計測アンケート','options':[{'id':'opt_1','text':'A'},{'id':'opt_2','text':'B'}]},'media':None,'version':1,'commentsEnabled':True}
          mag_payload=json.dumps({'app':'fujiya_mitemaga','version':5,'article':article_obj},ensure_ascii=False,separators=(',',':'))
          curl_post('magazine_save','magazine_save_frame',{'payload':mag_payload},240)
          cleanup.append(('magazine_delete_frame',{'articleId':article,'userId':uid}))
          curl_post('magazine_comment_save','magazine_comment_save_frame',{'articleId':article,'commentId':mag_comment,'userId':uid,'userName':'GitHub Rebench','nickname':'','avatar':'','text':'temporary magazine benchmark comment','createdAt':now,'editToken':token},240)
          cleanup.append(('magazine_comment_delete_frame',{'commentId':mag_comment,'userId':uid,'editToken':token}))
          curl_post('magazine_vote','magazine_vote_frame',{'articleId':article,'userId':uid,'optionId':'opt_1'},240)
          curl_post('magazine_comment_delete','magazine_comment_delete_frame',{'commentId':mag_comment,'userId':uid,'editToken':token},240)
          cleanup=[x for x in cleanup if x[0]!='magazine_comment_delete_frame']
          curl_post('magazine_delete','magazine_delete_frame',{'articleId':article,'userId':uid},240)
          cleanup=[x for x in cleanup if x[0]!='magazine_delete_frame']

          for a,f in reversed(cleanup): silent_post(a,f)
          ranking=sorted(results,key=lambda r:r['seconds'],reverse=True)
          print('=== RANKING ===',flush=True)
          print(json.dumps(ranking,ensure_ascii=False,separators=(',',':')),flush=True)
          with open('gas-31231-rebench.json','w',encoding='utf-8') as f: json.dump({'results':results,'ranking':ranking},f,ensure_ascii=False,indent=2)
          PY
          python3 /tmp/bench.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-gas-31231-rebench
          path: gas-31231-rebench.json
