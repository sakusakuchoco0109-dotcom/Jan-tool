name: MiteKore Community Audit
on:
  push:
    paths:
      - 'mitekore-community-audit.js'
      - '.github/workflows/mitekore-community-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        mode: [mitereco, mitemaga]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare browser
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
          node --check mitekore-community-audit.js
      - name: Run production community audit
        env:
          AUDIT_MODE: ${{ matrix.mode }}
        run: node mitekore-community-audit.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-community-${{ matrix.mode }}
          path: |
            community-audit-result.json
            community-*.png
