name: MiteKore Full Functional Audit
on:
  push:
    paths:
      - 'mitekore-full-functional-audit.js'
      - '.github/workflows/mitekore-full-functional-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare browser
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
          node --check mitekore-full-functional-audit.js
      - name: Run real production audit
        run: node mitekore-full-functional-audit.js
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-full-functional-audit
          path: |
            functional-audit-result.json
            audit-*.png
