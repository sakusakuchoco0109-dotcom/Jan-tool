name: MiteKore Live Like Smoke
on:
  push:
    paths:
      - '.github/workflows/mitekore-like-live-smoke.yml'
  workflow_dispatch:

jobs:
  like-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install chromium --with-deps
      - name: Click one real like in the live UI
        env:
          APP_URL: https://hilarious-haupia-6e0406.netlify.app/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const APP = process.env.APP_URL;
          const TEST_USER = `fujiya_chatgpt_like_${process.env.GITHUB_RUN_ID}_${process.env.GITHUB_RUN_ATTEMPT}`;
          const POST_KEY = 'article:mag_ai_aiq_20260901_0012_012';
          const TITLE_NEEDLE = 'トラキア776';
          const GAS_CANDIDATES = [
            'https://script.google.com/macros/s/AKfycbxoqua0rvTXWabQSPYnJ9wvjYP8EZ0L5i-PlAwZclreciDwtmAS6dJeBXNjJrScqijm1A/exec',
            'https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec'
          ];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function gasGet(url, params={}) {
            const u = new URL(url);
            for (const [k,v] of Object.entries(params)) u.searchParams.set(k, String(v));
            const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),8000);
            try{
              const r = await fetch(u, {redirect:'follow',signal:ac.signal});
              const text = await r.text();
              let json=null; try{json=JSON.parse(text)}catch(_){}
              return {ok:r.ok,status:r.status,text:text.slice(0,500),json};
            }finally{clearTimeout(t)}
          }
          function semverScore(v){
            const m=String(v||'').match(/(?:^|v)(\d+)\.(\d+)\.(\d+)/i);if(!m)return 0;
            return Number(m[1])*1000000+Number(m[2])*1000+Number(m[3]);
          }
          async function chooseGas(){
            const checks=[];
            for(const url of GAS_CANDIDATES){
              try{
                const r=await gasGet(url,{action:'status'});
                const version=String(r.json?.version||r.json?.gasVersion||'');
                checks.push({url,version,status:r.status,score:semverScore(version)});
              }catch(e){checks.push({url,error:String(e),score:0})}
            }
            checks.sort((a,b)=>(b.score||0)-(a.score||0));
            const best=checks.find(x=>/^v?3\.12\./i.test(String(x.version||''))) || checks.find(x=>x.score>0);
            if(!best)throw new Error('GAS endpoint unavailable '+JSON.stringify(checks));
            return {url:best.url,version:best.version,checks};
          }
          async function dismiss(page){
            for(const sel of ['[data-profile-unlock-close]','#rareBurstCloseBtn','.mike-talk-close','#tutorialCloseBtn','#firstRunCloseBtn','#devicePairCloseBtn']){
              try{const x=page.locator(sel).first();if(await x.count()&&await x.isVisible())await x.click({force:true,timeout:900});}catch(_){}
            }
          }
          (async()=>{
            const gas=await chooseGas();
            console.log('GAS_SELECTED', gas.url, gas.version, JSON.stringify(gas.checks));
            if(!/^v?3\.12\./i.test(gas.version))throw new Error('3.12系GASが見つからない '+JSON.stringify(gas.checks));
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            await ctx.addInitScript(({TEST_USER,gasUrl})=>{
              localStorage.setItem('fujiya_collection_user_id',TEST_USER);
              localStorage.setItem('fujiya_mitereco_identity_user_v2',TEST_USER);
              localStorage.setItem('fujiya_collection_user_name','チャッピー動作確認');
              localStorage.setItem('fujiya_collection_profile_v20_1',JSON.stringify({name:'チャッピー動作確認',bio:'いいね動作確認用',favoritePlatforms:[],favoriteGames:[],links:{},visibility:{}}));
              localStorage.setItem('fujiya_collection_setup_done_v1','1');
              localStorage.setItem('fujiya_collection_tutorial_seen_v2_rc1474','1');
              localStorage.setItem('fujiya_collection_first_run_seen_v20_2_35cn','1');
              localStorage.setItem('fujiya_collection_share_opt_in_v1','1');
              localStorage.setItem('fujiya_collection_gas_endpoint',gasUrl);
            },{TEST_USER,gasUrl:gas.url});
            const page=await ctx.newPage();
            const logs=[];
            page.on('console',m=>logs.push(`${m.type()}: ${m.text()}`));
            page.on('pageerror',e=>logs.push(`PAGEERROR: ${e.message}`));
            await page.goto(APP,{waitUntil:'domcontentloaded',timeout:60000});
            await sleep(7000); await dismiss(page);
            const appInfo=await page.evaluate(()=>({clientVersion:String(window.__FUJIYA_CLIENT_APP_VERSION__||''),defaultGas:String(window.DEFAULT_GAS_ENDPOINT||''),activeGas:String(localStorage.getItem('fujiya_collection_gas_endpoint')||'')}));
            console.log('APP_INFO',JSON.stringify(appInfo));
            const mag=page.locator('[data-ui-tab="magazine"]:visible').first();
            if(!await mag.count()) throw new Error('みてトピタブが見つからない');
            await mag.click({force:true}); await sleep(1800); await dismiss(page);
            const articles=page.locator('[data-mag-view="articles"]:visible').first();
            if(!await articles.count()) throw new Error('記事タブが見つからない');
            await articles.click({force:true});
            await page.waitForFunction((needle)=>[...document.querySelectorAll('.mitemaga-card')].some(x=>x.textContent.includes(needle)),TITLE_NEEDLE,{timeout:70000});
            const card=page.locator('.mitemaga-card').filter({hasText:TITLE_NEEDLE}).first();
            const like=card.locator('.fujiya-cross-like').first();
            await like.waitFor({state:'visible',timeout:20000});
            const before={count:await like.locator('.fujiya-cross-like-count').textContent(),cls:await like.getAttribute('class'),pressed:await like.getAttribute('aria-pressed')};
            await like.click({force:true});
            await sleep(8000);
            const after={count:await like.locator('.fujiya-cross-like-count').textContent(),cls:await like.getAttribute('class'),pressed:await like.getAttribute('aria-pressed')};
            await page.screenshot({path:'like-smoke.png',fullPage:false});
            const state=await gasGet(gas.url,{action:'pt_like_state',userId:TEST_USER,postKeys:POST_KEY});
            const row=state.json?.likes?.[0]||null;
            const result={TEST_USER,POST_KEY,title:TITLE_NEEDLE,gasVersion:gas.version,appInfo,before,after,server:row,logs:logs.slice(-100)};
            fs.writeFileSync('like-smoke-result.json',JSON.stringify(result,null,2));
            console.log('LIKE_SMOKE_RESULT',JSON.stringify(result));
            if(!row?.liked) throw new Error('UIクリック後もGASで liked=true になっていない '+JSON.stringify(row));
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-like-live-smoke
          path: |
            like-smoke.png
            like-smoke-result.json
