name: TEMP check GAS 3.12.43
on:
  push:
    paths:
      - '.github/workflows/temp-check-gas-31243.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check live GAS version
        shell: bash
        run: |
          URL='https://script.google.com/macros/s/AKfycbwYj13IWQ9fjn6sWRhzoFIHXtyIdb2mXNeRF2C75-ZvdHpZ8Row1f13NGRt5iF5F72x/exec?action=status'
          curl -sS -L --max-time 90 "$URL" | tee /tmp/status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          print('VERSION='+str(d.get('version')))
          if d.get('version')!='3.12.43': raise SystemExit(2)
          PY
