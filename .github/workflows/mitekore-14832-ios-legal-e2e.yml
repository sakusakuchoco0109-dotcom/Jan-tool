name: MiteKore 14832 iOS Legal E2E
on:
  push:
    paths:
      - 'mitekore-14832-ios-legal-e2e.js'
      - '.github/workflows/mitekore-14832-ios-legal-e2e.yml'
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare Playwright WebKit
        run: |
          npm init -y
          npm i playwright@1.48.2
          npx playwright install webkit --with-deps
          node --check mitekore-14832-ios-legal-e2e.js
      - name: Run iPhone Safari layout test
        run: node mitekore-14832-ios-legal-e2e.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitekore-14832-ios-legal-e2e
          path: |
            mitekore-14832-ios-legal-e2e-result.json
            14832-*.png
